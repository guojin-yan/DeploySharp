<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img" aria-labelledby="title desc"><title id="title">滑动窗口的有界调度与内存</title><desc id="desc">共享源图、当前输入组与下一预取组，独立Session池执行固定batch1输入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="710" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="45" y="63" font-size="38" fill="#123247" font-weight="700">窗口可以很多，输入张量不能一次全铺开</text><text x="46" y="107" font-size="25" fill="#567387" font-weight="400">一次解码复用源图；当前分组推理时，准备下一组切片。</text><rect x="45" y="159" width="306" height="270" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="208" font-size="30" fill="#168d80" font-weight="650">源图</text><text x="68" y="256" font-size="26" fill="#123247" font-weight="400">解码一次</text><text x="68" y="306" font-size="25" fill="#567387" font-weight="400">共享只读像素</text><text x="68" y="355" font-size="24" fill="#567387" font-weight="400">await 完成后释放</text><rect x="421" y="159" width="438" height="270" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="445" y="208" font-size="30" fill="#168d80" font-weight="650">当前输入组</text><text x="445" y="255" font-size="25" fill="#567387" font-weight="400">最多 2 × S 个输入</text><rect x="446" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#168d80" stroke-width="2"/><text x="463" y="349" font-size="22" fill="#168d80" font-weight="600">W0</text><rect x="543" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#168d80" stroke-width="2"/><text x="560" y="349" font-size="22" fill="#168d80" font-weight="600">W1</text><rect x="640" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#168d80" stroke-width="2"/><text x="657" y="349" font-size="22" fill="#168d80" font-weight="600">W2</text><rect x="737" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#168d80" stroke-width="2"/><text x="754" y="349" font-size="22" fill="#168d80" font-weight="600">W3</text><rect x="911" y="159" width="438" height="270" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="935" y="208" font-size="30" fill="#ee8a72" font-weight="650">下一输入组</text><text x="935" y="255" font-size="25" fill="#567387" font-weight="400">有界预取，最多 2 × S</text><rect x="936" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#ee8a72" stroke-width="2"/><text x="953" y="349" font-size="22" fill="#ee8a72" font-weight="600">W4</text><rect x="1033" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#ee8a72" stroke-width="2"/><text x="1050" y="349" font-size="22" fill="#ee8a72" font-weight="600">W5</text><rect x="1130" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#ee8a72" stroke-width="2"/><text x="1147" y="349" font-size="22" fill="#ee8a72" font-weight="600">W6</text><rect x="1227" y="290" width="80" height="93" rx="8" fill="#e1efed" stroke="#ee8a72" stroke-width="2"/><text x="1244" y="349" font-size="22" fill="#ee8a72" font-weight="600">W7</text><path d="M359 297L407 297" fill="none" stroke="#168d80" stroke-width="3" marker-end="url(#arrow)"/><path d="M198 158V132H1130V148" fill="none" stroke="#ee8a72" stroke-width="3"/><rect x="45" y="473" width="1304" height="149" rx="16" fill="#e5f2ed" stroke="#c4ded5" stroke-width="2"/><text x="71" y="519" font-size="28" fill="#123247" font-weight="600">S = 独立 Session 数；固定模型 Batch=1，每个窗口分别执行。</text><text x="71" y="568" font-size="25" fill="#567387" font-weight="400">640×640 RGB FP32 张量约 4.69 MiB；当前组 + 下一组最多约 4 × S 份输入。</text><text x="46" y="674" font-size="24" fill="#567387" font-weight="400">这只是输入有效载荷估算。源图、权重、后端工作区、输出候选和 GC 都会影响进程峰值。</text></g></svg>
