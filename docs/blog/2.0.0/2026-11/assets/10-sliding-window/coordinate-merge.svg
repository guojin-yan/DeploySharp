<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="705" viewBox="0 0 1440 705" role="img" aria-labelledby="title desc"><title id="title">滑窗坐标与合并</title><desc id="desc">两个重叠窗口的框还原到原图后执行按类别NMS；说明Source模式防止重复增加裁剪偏移。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="705" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="45" y="63" font-size="38" fill="#123247" font-weight="700">同一辆车落入两个窗口，怎么合并？</text><text x="46" y="108" font-size="25" fill="#567387" font-weight="400">每次模型解码后先回到原图；全局按类别 NMS 再处理跨窗口重复框。</text><rect x="45" y="151" width="410" height="292" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="69" y="198" font-size="30" fill="#168d80" font-weight="650">窗口 A</text><text x="69" y="237" font-size="24" fill="#567387" font-weight="400">局部观察</text><rect x="160" y="288" width="162" height="94" rx="7" fill="#e6efed" stroke="#c2d7d1" stroke-width="2"/><rect x="151" y="277" width="184" height="117" rx="1" fill="none" stroke="#168d80" stroke-width="2"/><text x="69" y="420" font-size="24" fill="#168d80" font-weight="600">car · 0.91</text><rect x="515" y="151" width="410" height="292" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="539" y="198" font-size="30" fill="#ee8a72" font-weight="650">窗口 B</text><text x="539" y="237" font-size="24" fill="#567387" font-weight="400">重叠区域</text><rect x="630" y="288" width="162" height="94" rx="7" fill="#e6efed" stroke="#c2d7d1" stroke-width="2"/><rect x="621" y="277" width="184" height="117" rx="1" fill="none" stroke="#ee8a72" stroke-width="2"/><text x="539" y="420" font-size="24" fill="#ee8a72" font-weight="600">car · 0.88</text><path d="M933 310L973 310" fill="none" stroke="#168d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="985" y="151" width="410" height="292" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="1009" y="198" font-size="30" fill="#168d80" font-weight="650">源图结果</text><text x="1009" y="237" font-size="24" fill="#567387" font-weight="400">ClassAware NMS</text><rect x="1100" y="288" width="162" height="94" rx="7" fill="#e6efed" stroke="#c2d7d1" stroke-width="2"/><rect x="1091" y="277" width="184" height="117" rx="1" fill="none" stroke="#168d80" stroke-width="2"/><text x="1008" y="420" font-size="24" fill="#168d80" font-weight="600">保留高分框与来源窗口</text><path d="M250 450V467H1190V451" fill="none" stroke="#168d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="487" width="1350" height="132" rx="16" fill="#e5f2ed" stroke="#c4ded5" stroke-width="2"/><text x="70" y="533" font-size="27" fill="#123247" font-weight="600">坐标示意：窗口原点 (760,148) + 局部点 (140,52) → 原图点 (900,200)</text><text x="70" y="578" font-size="24" fill="#567387" font-weight="400">本例 PrepareRectangle 已把 Crop + Letterbox 记录到 Transform；Source 模式不再添加窗口偏移。</text><text x="46" y="669" font-size="24" fill="#567387" font-weight="400">框与得分为原理示意。IoU 衡量框的重合度；NMS 只做抑制，不补全被截断的目标。</text></g></svg>
