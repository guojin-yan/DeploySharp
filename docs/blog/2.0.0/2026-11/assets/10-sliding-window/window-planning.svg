<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">窗口规划与边缘覆盖</title><desc id="desc">实际源图尺寸1920×1080，640窗口，20%重叠，尾部回贴使实际重叠可能大于设定比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="720" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="45" y="63" font-size="38" fill="#123247" font-weight="700">640 的窗口，怎样覆盖 1920×1080？</text><text x="46" y="108" font-size="25" fill="#567387" font-weight="400">目标重叠率 20%，常规步长 512；最后一个窗口回贴到右边、下边。</text><rect x="486" y="160" width="864" height="486" rx="2" fill="#e5edf2" stroke="#8ba7b8" stroke-width="2"/><rect x="486" y="160" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="716.4" y="160" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="946.8" y="160" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="1062" y="160" width="288" height="288" rx="0" fill="none" stroke="#ee8a72" stroke-width="2"/><rect x="486" y="358" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="716.4" y="358" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="946.8" y="358" width="288" height="288" rx="0" fill="none" stroke="#168d80" stroke-width="2"/><rect x="1062" y="358" width="288" height="288" rx="0" fill="none" stroke="#ee8a72" stroke-width="2"/><text x="46" y="205" font-size="27" fill="#168d80" font-weight="650">横向起点</text><text x="46" y="248" font-size="25" fill="#123247" font-weight="400">0 → 512 → 1024 → 1280</text><text x="46" y="316" font-size="27" fill="#168d80" font-weight="650">纵向起点</text><text x="46" y="359" font-size="25" fill="#123247" font-weight="400">0 → 440</text><text x="46" y="429" font-size="27" fill="#ee8a72" font-weight="650">最后一列</text><text x="46" y="472" font-size="25" fill="#123247" font-weight="400">1280 + 640 = 1920</text><text x="46" y="540" font-size="27" fill="#ee8a72" font-weight="650">最后一行</text><text x="46" y="583" font-size="25" fill="#123247" font-weight="400">440 + 640 = 1080</text><text x="491" y="686" font-size="25" fill="#567387" font-weight="400">8 个切片；开启完整图像补检后，共执行 9 次 Batch=1 输入。</text></g></svg>
