<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="525" viewBox="0 0 1440 525" role="img" aria-labelledby="title desc"><title id="title">ROI 命中规则</title><desc id="desc">中心点、目标覆盖比例和 IoU 使用不同分母，不能混用同一个阈值解释。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="525" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="42" y="60" font-size="38" fill="#123247" font-weight="700">“碰到区域”有几种判定方法？</text><rect x="40" y="101" width="420" height="339" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="60" y="146" font-size="26" fill="#168d80" font-weight="650">CenterPoint</text><rect x="87" y="179" width="174" height="128" rx="1" fill="#e4f3ec" stroke="#168d80" stroke-width="2"/><rect x="175" y="223" width="216" height="108" rx="1" fill="none" stroke="#ee8a72" stroke-width="2"/><rect x="175" y="223" width="86" height="84" rx="0" fill="#a7d6ba" stroke="#a7d6ba" stroke-width="2"/><text x="95" y="205" font-size="19" fill="#168d80" font-weight="650">ROI</text><text x="282" y="252" font-size="19" fill="#b86550" font-weight="650">目标框</text><text x="60" y="379" font-size="24" fill="#123247" font-weight="600">中心点在 ROI 内即可</text><text x="60" y="415" font-size="21" fill="#567387" font-weight="400">不要求整个框进入区域</text><circle cx="283" cy="277" r="7" fill="#ee8a72"/><rect x="510" y="101" width="420" height="339" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="530" y="146" font-size="26" fill="#168d80" font-weight="650">IntersectionOverResult</text><rect x="557" y="179" width="174" height="128" rx="1" fill="#e4f3ec" stroke="#168d80" stroke-width="2"/><rect x="645" y="223" width="216" height="108" rx="1" fill="none" stroke="#ee8a72" stroke-width="2"/><rect x="645" y="223" width="86" height="84" rx="0" fill="#a7d6ba" stroke="#a7d6ba" stroke-width="2"/><text x="565" y="205" font-size="19" fill="#168d80" font-weight="650">ROI</text><text x="752" y="252" font-size="19" fill="#b86550" font-weight="650">目标框</text><text x="530" y="379" font-size="24" fill="#123247" font-weight="600">交集面积 ÷ 目标框面积</text><text x="530" y="415" font-size="21" fill="#567387" font-weight="400">目标有多少比例进入区域</text><rect x="980" y="101" width="420" height="339" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="1000" y="146" font-size="26" fill="#168d80" font-weight="650">IoU</text><rect x="1027" y="179" width="174" height="128" rx="1" fill="#e4f3ec" stroke="#168d80" stroke-width="2"/><rect x="1115" y="223" width="216" height="108" rx="1" fill="none" stroke="#ee8a72" stroke-width="2"/><rect x="1115" y="223" width="86" height="84" rx="0" fill="#a7d6ba" stroke="#a7d6ba" stroke-width="2"/><text x="1035" y="205" font-size="19" fill="#168d80" font-weight="650">ROI</text><text x="1222" y="252" font-size="19" fill="#b86550" font-weight="650">目标框</text><text x="1000" y="379" font-size="24" fill="#123247" font-weight="600">交集面积 ÷ 并集面积</text><text x="1000" y="415" font-size="21" fill="#567387" font-weight="400">衡量两个区域的形状重合</text><text x="46" y="488" font-size="24" fill="#567387" font-weight="400">大区域包住小目标时，IoU 仍可能很小。本例采用目标覆盖比例，并让命中的排除区优先。</text></g></svg>