<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="439" viewBox="0 0 1440 439" role="img" aria-labelledby="title desc"><title id="title">ROI 快照更新</title><desc id="desc">当前帧保持旧快照，完整校验的新配置原子安装给后续帧，失败配置不覆盖有效快照。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="439" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="42" y="61" font-size="38" fill="#123247" font-weight="700">改配置时，一帧只用一个快照</text><rect x="43" y="116" width="339" height="136" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="66" y="163" font-size="30" fill="#123247" font-weight="650">帧 A 开始</text><text x="66" y="211" font-size="27" fill="#168d80" font-weight="650">捕获 snapshot 7</text><rect x="548" y="116" width="339" height="136" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="572" y="163" font-size="30" fill="#123247" font-weight="650">读取候选 JSON</text><text x="572" y="211" font-size="25" fill="#567387" font-weight="400">完整校验后原子替换</text><rect x="1055" y="116" width="339" height="136" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="1078" y="163" font-size="30" fill="#123247" font-weight="650">帧 B 开始</text><text x="1078" y="211" font-size="27" fill="#168d80" font-weight="650">捕获 snapshot 8</text><path d="M398 183L529 183" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M904 183L1035 183" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="43" y="300" width="661" height="94" rx="16" fill="#e2f3eb" stroke="#d5e2e9" stroke-width="2"/><text x="66" y="339" font-size="27" fill="#123247" font-weight="600">正在运行的帧 A 继续使用 7</text><text x="66" y="373" font-size="23" fill="#567387" font-weight="400">避免裁剪用旧区域、过滤却换成新区域</text><rect x="731" y="300" width="663" height="94" rx="16" fill="#fff0e9" stroke="#d5e2e9" stroke-width="2"/><text x="754" y="339" font-size="27" fill="#123247" font-weight="600">候选配置无效：拒绝替换</text><text x="754" y="373" font-size="23" fill="#567387" font-weight="400">管理器保留上一个可用快照</text></g></svg>