<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">全图过滤与区域裁剪</title><desc id="desc">上方展示全图检测后过滤，下方展示区域裁剪、推理、源图坐标合并及业务过滤。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="620" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="44" y="62" font-size="38" fill="#123247" font-weight="700">同一张图，两种 ROI 用法</text><text x="46" y="103" font-size="25" fill="#567387" font-weight="400">区域筛选决定保留什么；区域裁剪决定把什么送给模型。</text><text x="46" y="167" font-size="27" fill="#168d80" font-weight="650">A · FilterResults</text><rect x="45" y="188" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="65" y="231" font-size="27" fill="#123247" font-weight="650">原图</text><text x="65" y="272" font-size="22" fill="#567387" font-weight="400">完整视野</text><path d="M353 243L385 243" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="395" y="188" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="415" y="231" font-size="27" fill="#123247" font-weight="650">模型推理</text><text x="415" y="272" font-size="22" fill="#567387" font-weight="400">一次全图输入</text><path d="M703 243L735 243" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="745" y="188" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="765" y="231" font-size="27" fill="#123247" font-weight="650">区域命中判断</text><text x="765" y="272" font-size="22" fill="#567387" font-weight="400">包含区 / 排除区</text><path d="M1053 243L1085 243" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1095" y="188" width="300" height="112" rx="16" fill="#e1f3ed" stroke="#d5e2e9" stroke-width="2"/><text x="1115" y="231" font-size="27" fill="#123247" font-weight="650">业务结果</text><text x="1115" y="272" font-size="22" fill="#567387" font-weight="400">保留原图坐标</text><text x="46" y="393" font-size="27" fill="#168d80" font-weight="650">B · CropAndInfer</text><rect x="45" y="414" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="65" y="457" font-size="27" fill="#123247" font-weight="650">同一张原图</text><text x="65" y="498" font-size="22" fill="#567387" font-weight="400">解码一次</text><path d="M353 469L385 469" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="395" y="414" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="415" y="457" font-size="27" fill="#123247" font-weight="650">两个区域</text><text x="415" y="498" font-size="22" fill="#567387" font-weight="400">分别前处理与推理</text><path d="M703 469L735 469" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="745" y="414" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="765" y="457" font-size="27" fill="#123247" font-weight="650">回到原图并合并</text><text x="765" y="498" font-size="22" fill="#567387" font-weight="400">跨 ROI 去重</text><path d="M1053 469L1085 469" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1095" y="414" width="300" height="112" rx="16" fill="#e1f3ed" stroke="#d5e2e9" stroke-width="2"/><text x="1115" y="457" font-size="27" fill="#123247" font-weight="650">再用业务规则</text><text x="1115" y="498" font-size="22" fill="#567387" font-weight="400">输出有效目标</text><text x="46" y="586" font-size="24" fill="#567387" font-weight="400">裁剪路线增加模型输入次数。是否更快、能否检出更多目标，要按模型与图像实测。</text></g></svg>