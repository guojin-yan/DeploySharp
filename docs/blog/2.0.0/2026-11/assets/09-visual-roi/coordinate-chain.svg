<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="505" viewBox="0 0 1440 505" role="img" aria-labelledby="title desc"><title id="title">ROI 坐标转换</title><desc id="desc">用一个示意点展示源图、裁剪局部和模型输入之间的正向及逆向映射，避免重复添加偏移。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#168d80"/></marker></defs><rect width="1440" height="505" rx="22" fill="#f3f7fa"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="43" y="62" font-size="38" fill="#123247" font-weight="700">裁剪后的框，怎样回到原图？</text><text x="44" y="102" font-size="25" fill="#567387" font-weight="400">示意：原图 1920×1080；裁剪 (320,180,960,720)；模型输入 640×640。</text><rect x="45" y="146" width="405" height="169" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="190" font-size="28" fill="#123247" font-weight="650">源图坐标</text><text x="68" y="242" font-size="29" fill="#168d80" font-weight="650">点 (800,450)</text><text x="68" y="286" font-size="23" fill="#567387" font-weight="400">裁剪原点 (320,180)</text><path d="M459 229L500 229" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="515" y="146" width="405" height="169" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="538" y="190" font-size="28" fill="#123247" font-weight="650">裁剪局部坐标</text><text x="538" y="242" font-size="29" fill="#168d80" font-weight="650">点 (480,270)</text><text x="538" y="286" font-size="23" fill="#567387" font-weight="400">减去裁剪偏移</text><path d="M929 229L970 229" stroke="#168d80" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="985" y="146" width="405" height="169" rx="16" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="1008" y="190" font-size="28" fill="#123247" font-weight="650">Letterbox 模型坐标</text><text x="1008" y="242" font-size="29" fill="#168d80" font-weight="650">点 (320,260)</text><text x="1008" y="286" font-size="23" fill="#567387" font-weight="400">缩放 2/3，顶部补 80</text><path d="M1183 334V368H248V334" stroke="#168d80" stroke-width="3" fill="none"/><text x="370" y="411" font-size="29" fill="#123247" font-weight="650">解码时逆 Letterbox，再逆裁剪变换 → 原图结果</text><text x="210" y="464" font-size="25" fill="#567387" font-weight="400">PreparedVisualInput 携带完整变换；使用本例 Decoder 后，不再手动加一次 ROI 偏移。</text></g></svg>