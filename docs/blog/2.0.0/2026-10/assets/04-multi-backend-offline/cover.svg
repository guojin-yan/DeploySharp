<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="800" viewBox="0 0 1410 800" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 2.0.0：多后端与离线部署</title>
  <desc id="desc">延续系列深蓝青绿题图。本地模型经过 C# 应用与匹配的原生运行时打包，交付到目标设备。用文件夹、应用底座和计算设备表达准备、打包、运行一条路径。图形为部署流程示意，不是运行截图。</desc>
