<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 多后端选择决策图</title>
  <desc id="desc">从设备、模型文件和交付目标三个问题出发，选择 ORT CPU、ORT CUDA、OpenVINO、OpenCV DNN 或 TensorRT。图中强调模型合同和目标运行时必须先确认。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#328c82"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#18354d" flood-opacity=".1"/></filter></defs>
  <rect width="1440" height="860" rx="28" fill="#f4f8fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="78" font-size="42" font-weight="750" fill="#142b43">后端选择：从设备和模型出发</text>
    <text x="62" y="122" font-size="24" fill="#557086">先问三个问题，再安装一组匹配的 NuGet 与 native runtime</text>
    <g filter="url(#shadow)"><rect x="60" y="185" width="350" height="180" rx="22" fill="#e3f1ee" stroke="#a7cfc3" stroke-width="2"/><rect x="545" y="185" width="350" height="180" rx="22" fill="#e8edf7" stroke="#afc0d7" stroke-width="2"/><rect x="1030" y="185" width="350" height="180" rx="22" fill="#f3eaf8" stroke="#ccb7d8" stroke-width="2"/></g>
    <g text-anchor="middle" fill="#18354d"><text x="235" y="236" font-size="29" font-weight="700">① 设备</text><text x="235" y="280" font-size="23">CPU / NVIDIA GPU</text><text x="235" y="319" font-size="21" fill="#557086">系统、驱动、架构</text><text x="720" y="236" font-size="29" font-weight="700">② 模型</text><text x="720" y="280" font-size="23">ONNX / Engine</text><text x="720" y="319" font-size="21" fill="#557086">动态 Shape、算子、输入输出</text><text x="1205" y="236" font-size="29" font-weight="700">③ 交付目标</text><text x="1205" y="280" font-size="23">在线准备 / 严格离线</text><text x="1205" y="319" font-size="21" fill="#557086">是否随应用带齐文件</text></g>
    <g fill="none" stroke="#328c82" stroke-width="4" marker-end="url(#arrow)"><path d="M235 379V430"/><path d="M720 379V430"/><path d="M1205 379V430"/></g>
    <rect x="60" y="450" width="1320" height="54" rx="16" fill="#183c50"/><text x="92" y="486" font-size="25" fill="#f1fafb">通过模型支持矩阵确认“能否运行”，再根据设备选择“怎样运行”</text>
    <g filter="url(#shadow)"><rect x="60" y="552" width="232" height="190" rx="20" fill="#fff" stroke="#a7cfc3" stroke-width="2"/><rect x="350" y="552" width="232" height="190" rx="20" fill="#fff" stroke="#afc0d7" stroke-width="2"/><rect x="640" y="552" width="232" height="190" rx="20" fill="#fff" stroke="#cdb6d8" stroke-width="2"/><rect x="930" y="552" width="232" height="190" rx="20" fill="#fff" stroke="#a7cfc3" stroke-width="2"/><rect x="1220" y="552" width="160" height="190" rx="20" fill="#fff4e8" stroke="#dfbd98" stroke-width="2"/></g>
    <g text-anchor="middle"><text x="176" y="600" font-size="26" font-weight="700" fill="#286e60">ORT CPU</text><text x="176" y="641" font-size="20" fill="#557086">普通 CPU 起点</text><text x="176" y="680" font-size="19" fill="#557086">最易迁移</text><text x="176" y="714" font-size="18" fill="#7a5b48">CPU native</text><text x="466" y="600" font-size="26" font-weight="700" fill="#385779">ORT CUDA</text><text x="466" y="641" font-size="20" fill="#557086">ONNX + NVIDIA</text><text x="466" y="680" font-size="19" fill="#557086">CUDA / cuDNN</text><text x="466" y="714" font-size="18" fill="#7a5b48">GPU native</text><text x="756" y="600" font-size="26" font-weight="700" fill="#64447f">OpenVINO</text><text x="756" y="641" font-size="20" fill="#557086">CPU 评估</text><text x="756" y="680" font-size="19" fill="#557086">runtime</text><text x="756" y="714" font-size="18" fill="#7a5b48">按适配器验证</text><text x="1046" y="600" font-size="26" font-weight="700" fill="#286e60">OpenCV DNN</text><text x="1046" y="641" font-size="20" fill="#557086">已有 OpenCV</text><text x="1046" y="680" font-size="19" fill="#557086">检查 importer</text><text x="1046" y="714" font-size="18" fill="#7a5b48">模型有边界</text><text x="1300" y="600" font-size="25" font-weight="700" fill="#985d3d">TensorRT</text><text x="1300" y="641" font-size="19" fill="#557086">NVIDIA 调优</text><text x="1300" y="680" font-size="18" fill="#557086">Engine</text><text x="1300" y="714" font-size="17" fill="#7a5b48">目标机构建</text></g>
    <text x="60" y="805" font-size="21" fill="#557086">同一应用可准备多种后端，但每次运行应显式记录最终选择，不要把失败静默降级后仍写成 GPU 成功。</text>
  </g>
</svg>
