<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="600" viewBox="0 0 1410 600" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 2.0.0：在 C# 中部署视觉模型</title>
  <desc id="desc">深蓝色技术题图。左侧为项目名称与视觉推理、OCR、文档处理三个主题；右侧用输入图像、C# 推理模块和结果卡片说明工作方式。插画为流程示意，不是真实检测输出。</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#20344f" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050e1a" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#5cdbbd"/>
    </marker>
  </defs>
  <rect width="1410" height="600" rx="28" fill="#122238"/>
  <path d="M750 0H1382Q1410 0 1410 28V572Q1410 600 1382 600H750Z" fill="url(#grid)"/>
