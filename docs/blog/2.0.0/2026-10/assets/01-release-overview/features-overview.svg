<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2050" viewBox="0 0 1440 2050" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 2.0.0 核心特色：多后端、多模型、简洁接入</title>
  <desc id="desc">项目特色总览。五类后端分别服务视觉张量推理和 GGUF 生成；展示 YOLO26 等视觉任务、PaddleOCR 与文档处理、初始化后的核心调用、Batch 与会话池、异步预取、ROI 与大图切片，以及按需模型下载和本地模型加载。所有图形为能力示意，不表示性能实测或任意模型均可在全部后端运行。</desc>
  <defs>
    <linearGradient id="bg" x2="0.8" y2="1"><stop stop-color="#0b192e"/><stop offset="1" stop-color="#152440"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#62d8ec"/><stop offset="1" stop-color="#83e6b6"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#18324b"/><stop offset="1" stop-color="#13263d"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#030a15" flood-opacity="0.3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#66dcc6"/></marker>
    <symbol id="image" viewBox="0 0 200 128">
      <rect x="2" y="2" width="196" height="124" rx="13" fill="#25455b" stroke="#4d7990" stroke-width="2"/>
      <circle cx="157" cy="31" r="14" fill="#f7ba83"/>
      <path d="M4 109L57 47L103 94L137 64L196 112V124H4Z" fill="#609d95"/>
      <rect x="35" y="42" width="66" height="76" rx="5" fill="none" stroke="#88eed2" stroke-width="4"/>
      <rect x="111" y="64" width="65" height="53" rx="5" fill="none" stroke="#fab993" stroke-width="4"/>
    </symbol>
    <symbol id="chip" viewBox="0 0 100 100">
      <path d="M22 8V21M41 8V21M60 8V21M79 8V21M22 80V93M41 80V93M60 80V93M79 80V93M8 22H21M8 41H21M8 60H21M8 79H21M80 22H93M80 41H93M80 60H93M80 79H93" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <rect x="20" y="20" width="61" height="61" rx="12" fill="#244958" stroke="currentColor" stroke-width="3"/>
      <path d="M35 50L46 61L66 38" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="1440" height="2050" rx="30" fill="url(#bg)"/>
  <path d="M1050 0L1440 310M1170 0L1440 215M1260 0L1440 140" stroke="#2c4966" stroke-width="2" opacity="0.6"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="60" y="43" width="178" height="34" rx="17" fill="#24425b"/>
    <text x="149" y="67" text-anchor="middle" font-size="20" font-weight="600" fill="#b8d8ed">JYPPX · 开源项目</text>
    <text x="54" y="175" font-size="94" font-weight="750" letter-spacing="-3" fill="#f5f8fc">DeploySharp <tspan fill="url(#accent)">2.0.0</tspan></text>
    <text x="60" y="242" font-size="44" font-weight="700" fill="#f5f8fc">多后端，多模型，让 C# 模型部署更简单</text>
    <text x="61" y="282" font-size="25" fill="#b5cadd">视觉推理 · OCR · 文档处理 · 可扩展的模型工作流</text>

    <g filter="url(#shadow)">
      <rect x="48" y="322" width="1344" height="180" rx="24" fill="url(#panel)" stroke="#42637e" stroke-width="2"/>
      <text x="76" y="365" font-size="27" font-weight="700" fill="#eff8ff">按设备与模型选择推理后端</text>
      <text x="1359" y="363" text-anchor="end" font-size="21" fill="#9fbcd3">视觉张量推理 / GGUF 生成</text>
      <g text-anchor="middle">
        <rect x="76" y="385" width="242" height="88" rx="15" fill="#26415e"/>
        <text x="197" y="422" font-size="29" font-weight="700" fill="#e2dcff">ONNX Runtime</text><text x="197" y="451" font-size="22" fill="#b8ccdf">CPU / CUDA</text>
        <rect x="334" y="385" width="242" height="88" rx="15" fill="#24465a"/>
        <text x="455" y="422" font-size="29" font-weight="700" fill="#8ee7ed">OpenVINO</text><text x="455" y="451" font-size="22" fill="#b8ccdf">已验证 CPU 路径</text>
        <rect x="592" y="385" width="242" height="88" rx="15" fill="#234940"/>
        <text x="713" y="422" font-size="29" font-weight="700" fill="#b9ef8b">TensorRT</text><text x="713" y="451" font-size="22" fill="#b8ccdf">NVIDIA CUDA</text>
        <rect x="850" y="385" width="242" height="88" rx="15" fill="#3b374a"/>
        <text x="971" y="422" font-size="29" font-weight="700" fill="#ffbe9f">OpenCV DNN</text><text x="971" y="451" font-size="22" fill="#b8ccdf">已验证 CPU 路径</text>
        <rect x="1108" y="385" width="256" height="88" rx="15" fill="#353653"/>
        <text x="1236" y="422" font-size="29" font-weight="700" fill="#d8c7fa">LlamaSharp</text><text x="1236" y="451" font-size="22" fill="#b8ccdf">GGUF / LLM</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="526" width="660" height="430" rx="24" fill="url(#panel)" stroke="#396e89" stroke-width="2"/>
      <text x="78" y="578" font-size="34" font-weight="700" fill="#eff8ff">常用视觉任务，配套前后处理</text>
      <use href="#image" x="78" y="608" width="239" height="153"/>
      <text x="345" y="642" font-size="28" font-weight="600" fill="#91e8d6">YOLO26 / YOLO 系列</text>
      <text x="345" y="683" font-size="25" fill="#d3e2ef">RT-DETR / RF-DETR</text>
      <text x="345" y="721" font-size="25" fill="#d3e2ef">DEIMv2 / PP-YOLOE</text>
      <g font-size="24" text-anchor="middle" fill="#e3f0f8">
        <rect x="78" y="787" width="135" height="48" rx="12" fill="#2a475d"/><text x="145" y="820">目标检测</text>
        <rect x="228" y="787" width="135" height="48" rx="12" fill="#2a475d"/><text x="295" y="820">图像分类</text>
        <rect x="378" y="787" width="135" height="48" rx="12" fill="#2a475d"/><text x="445" y="820">实例分割</text>
        <rect x="528" y="787" width="150" height="48" rx="12" fill="#2a475d"/><text x="603" y="820">关键点</text>
        <rect x="78" y="851" width="135" height="48" rx="12" fill="#243f53"/><text x="145" y="884">旋转框</text>
        <rect x="228" y="851" width="135" height="48" rx="12" fill="#243f53"/><text x="295" y="884">异常检测</text>
        <rect x="378" y="851" width="135" height="48" rx="12" fill="#243f53"/><text x="445" y="884">背景移除</text>
        <rect x="528" y="851" width="150" height="48" rx="12" fill="#243f53"/><text x="603" y="884">提示分割</text>
      </g>
      <text x="78" y="932" font-size="20" fill="#9bb8cf">PaDiM · RMBG · SAM ViT-B 等已验证工件</text>

      <rect x="732" y="526" width="660" height="430" rx="24" fill="url(#panel)" stroke="#59658d" stroke-width="2"/>
      <text x="762" y="578" font-size="34" font-weight="700" fill="#eff8ff">从 OCR，到文档任务组合</text>
      <text x="762" y="633" font-size="33" font-weight="700" fill="#cbb8f4">PP-OCRv4 / v5 / v6</text>
      <g text-anchor="middle" font-size="26" font-weight="600" fill="#e9f5fb">
        <rect x="762" y="665" width="119" height="67" rx="14" fill="#30455f"/><text x="821" y="708">检测</text>
        <rect x="921" y="665" width="119" height="67" rx="14" fill="#30455f"/><text x="980" y="708">裁剪</text>
        <rect x="1080" y="665" width="119" height="67" rx="14" fill="#30455f"/><text x="1139" y="708">方向</text>
        <rect x="1239" y="665" width="123" height="67" rx="14" fill="#30455f"/><text x="1300" y="708">识别</text>
      </g>
      <g stroke="#66dcc6" stroke-width="3" marker-end="url(#arrow)"><path d="M886 699H910"/><path d="M1045 699H1069"/><path d="M1204 699H1228"/></g>
      <text x="762" y="779" font-size="25" fill="#b7ccdf">输出文字、区域坐标与置信度</text>
      <path d="M762 804H1362" stroke="#3c536d"/>
      <text x="762" y="847" font-size="29" font-weight="700" fill="#f7c89b">PP-Structure</text>
      <text x="762" y="888" font-size="25" fill="#e1eaf3">版面 / 表格 / 公式 / 印章 / 图表</text>
      <text x="762" y="931" font-size="20" fill="#9bb8cf">按任务组合模块，各模型后端范围独立</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="980" width="660" height="365" rx="24" fill="url(#panel)" stroke="#4b6d7a" stroke-width="2"/>
      <text x="78" y="1032" font-size="34" font-weight="700" fill="#eff8ff">接入简洁，关键环节可控</text>
      <rect x="78" y="1058" width="600" height="187" rx="16" fill="#0e1d31"/>
      <circle cx="100" cy="1081" r="5" fill="#ee9a86"/><circle cx="120" cy="1081" r="5" fill="#e7c28e"/><circle cx="140" cy="1081" r="5" fill="#7ad3b7"/>
      <text x="657" y="1088" text-anchor="end" font-size="19" fill="#94aec6">C# · 初始化后的核心调用</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="24">
        <text x="99" y="1131" fill="#e6eff7">var result = pipeline.Run(input)</text>
        <text x="99" y="1163" fill="#84e3cc">    .GetValue&lt;DetectionResult&gt;();</text>
        <text x="99" y="1195" fill="#e6eff7">foreach (var d in result.Detections)</text>
        <text x="99" y="1227" fill="#b6c7e5">    Console.WriteLine(d.Label.Label);</text>
      </g>
      <text x="78" y="1293" font-size="25" fill="#9ae5d7">缩放 / 归一化可选 · 自定义模型与结果</text>

      <rect x="732" y="980" width="660" height="365" rx="24" fill="url(#panel)" stroke="#4e7c72" stroke-width="2"/>
      <text x="762" y="1032" font-size="34" font-weight="700" fill="#eff8ff">速度优化，覆盖整条处理链</text>
      <use href="#chip" x="1210" y="1080" width="124" height="124" color="#81e0c6"/>
      <g font-size="27" fill="#e0edf6">
        <text x="770" y="1105"><tspan fill="#8ae6ce">✓</tspan> Batch 与独立 Session 池</text>
        <text x="770" y="1158"><tspan fill="#8ae6ce">✓</tspan> 视频帧有界异步预取</text>
        <text x="770" y="1211"><tspan fill="#8ae6ce">✓</tspan> CUDA 前后处理与缓冲复用</text>
      </g>
      <text x="762" y="1293" font-size="22" fill="#a4bfd2">CUDA 加速按模型路径启用，保留 CPU 回退</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="1369" width="660" height="352" rx="24" fill="url(#panel)" stroke="#658598" stroke-width="2"/>
      <text x="78" y="1421" font-size="34" font-weight="700" fill="#eff8ff">ROI + 大图重叠切片</text>
      <rect x="78" y="1450" width="275" height="179" rx="12" fill="#28485a" stroke="#5d8297" stroke-width="2"/>
      <path d="M86 1606L151 1501L220 1567L278 1484L345 1610V1620H86Z" fill="#568879"/>
      <rect x="94" y="1467" width="133" height="94" rx="5" fill="#7ae3c4" fill-opacity="0.08" stroke="#82e8cf" stroke-width="3"/>
      <rect x="205" y="1467" width="132" height="94" rx="5" fill="#7ae3c4" fill-opacity="0.08" stroke="#82e8cf" stroke-width="3"/>
      <rect x="94" y="1545" width="133" height="67" rx="5" fill="#7ae3c4" fill-opacity="0.08" stroke="#82e8cf" stroke-width="3"/>
      <rect x="205" y="1545" width="132" height="67" rx="5" fill="#7ae3c4" fill-opacity="0.08" stroke="#82e8cf" stroke-width="3"/>
      <text x="386" y="1497" font-size="27" font-weight="600" fill="#f4c49c">聚焦业务区域</text>
      <text x="386" y="1543" font-size="25" fill="#c2d8e7">重叠切片检测</text>
      <text x="386" y="1587" font-size="25" fill="#c2d8e7">映射回完整源图</text>
      <text x="78" y="1680" font-size="24" fill="#a9d8dd">区域配置 → 检测 → 坐标还原 → 合并</text>

      <rect x="732" y="1369" width="660" height="352" rx="24" fill="url(#panel)" stroke="#6b6c8d" stroke-width="2"/>
      <text x="762" y="1421" font-size="34" font-weight="700" fill="#eff8ff">模型按需获取，支持离线复用</text>
      <g text-anchor="middle">
        <rect x="762" y="1465" width="165" height="98" rx="17" fill="#2d4360"/><text x="844" y="1505" font-size="29" font-weight="700" fill="#e3d5ff">Release</text><text x="844" y="1538" font-size="23" fill="#c3d4e4">选择模型</text>
        <rect x="979" y="1465" width="165" height="98" rx="17" fill="#274b53"/><text x="1061" y="1505" font-size="29" font-weight="700" fill="#8be2cf">按需下载</text><text x="1061" y="1538" font-size="23" fill="#c3d4e4">配套文件</text>
        <rect x="1196" y="1465" width="165" height="98" rx="17" fill="#3d414f"/><text x="1278" y="1505" font-size="29" font-weight="700" fill="#f5ca9e">本地缓存</text><text x="1278" y="1538" font-size="23" fill="#c3d4e4">离线使用</text>
      </g>
      <g stroke="#66dcc6" stroke-width="3" marker-end="url(#arrow)"><path d="M936 1515H966"/><path d="M1153 1515H1183"/></g>
      <text x="762" y="1616" font-size="25" fill="#e0eaf4">自有模型也可直接从本地路径加载</text>
      <text x="762" y="1672" font-size="22" fill="#9fbad0">模型资产与原生运行时分别准备</text>
    </g>

    <rect x="48" y="1745" width="1344" height="173" rx="24" fill="#1c3c4c" stroke="#4b8b91" stroke-width="2"/>
    <text x="78" y="1800" font-size="35" font-weight="700" fill="#e6fbf5">CPU 起步，GPU 按需加速</text>
    <rect x="921" y="1770" width="438" height="52" rx="14" fill="#2a5361"/>
    <text x="1140" y="1806" text-anchor="middle" font-size="25" font-weight="600" fill="#e5f9f5">Windows 10/11 x64 · 发布验证</text>
    <text x="78" y="1848" font-size="24" fill="#bed7e4">公开模型 × 后端验证状态，并提供具名设备性能参考。</text>
    <text x="78" y="1886" font-size="22" fill="#abc6d8">不同模型后端范围不同；PaddleOCR-VL 等实验性路径另行标注。</text>
    <text x="720" y="1974" text-anchor="middle" font-size="31" font-weight="600" fill="#8bded7">github.com/guojin-yan/DeploySharp</text>
    <text x="720" y="2015" text-anchor="middle" font-size="22" fill="#9eb9cf">Apache-2.0（库代码） · NuGet / GitHub Packages / Release</text>
  </g>
</svg>
