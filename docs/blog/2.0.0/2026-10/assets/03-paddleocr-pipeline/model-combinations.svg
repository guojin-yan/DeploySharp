<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">PaddleOCR v4 v5 v6 的模型组合</title>
  <desc id="desc">三组 PaddleOCR 核心组合都由 DET、可选 CLS、REC 和配套字典组成。v4 使用 legacy CLS 与 v4 字典，v5 使用对应 Mobile 或 Server CLS 与 v5 字典，v6 复用 v5 Mobile CLS 并使用对应 v6 字典。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#328c82"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#18354d" flood-opacity=".1"/></filter></defs>
  <rect width="1440" height="860" rx="28" fill="#f4f8fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="78" font-size="42" font-weight="750" fill="#142b43">PaddleOCR 版本不是只换一个文件</text>
    <text x="62" y="122" font-size="24" fill="#557086">DET、CLS、REC 和字典必须成套，代码再用同一条 OcrPipeline 串起来</text>
    <g fill="none" stroke="#328c82" stroke-width="4" marker-end="url(#arrow)"><path d="M318 294H358"/><path d="M592 294H632"/><path d="M866 294H906"/><path d="M1140 294H1180"/></g>
    <g filter="url(#shadow)">
      <rect x="56" y="190" width="235" height="210" rx="21" fill="#e7eff6" stroke="#afc3d4" stroke-width="2"/><rect x="350" y="190" width="235" height="210" rx="21" fill="#e3f1ee" stroke="#a7cfc3" stroke-width="2"/><rect x="644" y="190" width="235" height="210" rx="21" fill="#e8edf7" stroke="#afc0d7" stroke-width="2"/><rect x="938" y="190" width="235" height="210" rx="21" fill="#f3eaf8" stroke="#ccb7d8" stroke-width="2"/><rect x="1212" y="190" width="172" height="210" rx="21" fill="#fff4e8" stroke="#dfbd98" stroke-width="2"/>
    </g>
    <g text-anchor="middle" fill="#18354d"><text x="174" y="240" font-size="28" font-weight="700">原图</text><text x="174" y="286" font-size="23">PaddleOCR</text><text x="174" y="326" font-size="21" fill="#557086">一张图片</text><text x="174" y="365" font-size="20" fill="#557086">整页输入</text>
      <text x="468" y="240" font-size="28" font-weight="700">DET</text><text x="468" y="286" font-size="23">文字检测</text><text x="468" y="326" font-size="21" fill="#557086">文字框 / Polygon</text><text x="468" y="365" font-size="20" fill="#557086">三组都要配套</text>
      <text x="762" y="240" font-size="28" font-weight="700">CLS</text><text x="762" y="286" font-size="23">方向分类</text><text x="762" y="326" font-size="21" fill="#557086">0° / 180°</text><text x="762" y="365" font-size="20" fill="#557086">可选阶段</text>
      <text x="1056" y="240" font-size="28" font-weight="700">REC</text><text x="1056" y="286" font-size="23">文字识别</text><text x="1056" y="326" font-size="21" fill="#557086">CTC 字符索引</text><text x="1056" y="365" font-size="20" fill="#557086">必须配字典</text>
      <text x="1298" y="240" font-size="27" font-weight="700">结果</text><text x="1298" y="286" font-size="21">文字</text><text x="1298" y="322" font-size="20">分数</text><text x="1298" y="358" font-size="20">原图区域</text>
    </g>
    <text x="60" y="466" font-size="30" font-weight="700" fill="#18354d">按版本选择的实际组合</text>
    <g filter="url(#shadow)"><rect x="60" y="502" width="420" height="218" rx="20" fill="#fff" stroke="#b3c8d7" stroke-width="2"/><rect x="510" y="502" width="420" height="218" rx="20" fill="#fff" stroke="#a9cfc4" stroke-width="2"/><rect x="960" y="502" width="420" height="218" rx="20" fill="#fff" stroke="#cdb6d8" stroke-width="2"/></g>
    <g fill="#18354d"><text x="90" y="550" font-size="27" font-weight="700">PP-OCRv4</text><text x="90" y="594" font-size="22" fill="#2c746a">DET v4 + legacy CLS + REC v4</text><text x="90" y="636" font-size="21" fill="#557086">字典：ppocrv4_keys.txt</text><text x="90" y="677" font-size="20" fill="#7a5b48">旧项目迁移优先</text>
      <text x="540" y="550" font-size="27" font-weight="700">PP-OCRv5</text><text x="540" y="594" font-size="22" fill="#2c746a">DET v5 + Mobile/Server CLS + REC v5</text><text x="540" y="636" font-size="21" fill="#557086">字典：ppocrv5_dict.txt</text><text x="540" y="677" font-size="20" fill="#7a5b48">本文默认 Mobile</text>
      <text x="990" y="550" font-size="27" font-weight="700">PP-OCRv6</text><text x="990" y="594" font-size="22" fill="#2c746a">DET v6 + v5 Mobile CLS + REC v6</text><text x="990" y="636" font-size="21" fill="#557086">字典：对应 v6 REC 字典</text><text x="990" y="677" font-size="20" fill="#7a5b48">目前没有独立 v6 CLS</text></g>
    <text x="60" y="800" font-size="22" fill="#557086">不要只替换 DET 或 REC 文件；模型输入、输出、方向分类和字典的版本关系要一起保留。</text>
  </g>
</svg>
