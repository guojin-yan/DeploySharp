<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">PaddleOCR Windows 与 Ubuntu 运行时结构</title>
  <desc id="desc">Windows 与 Ubuntu 使用相同的 C#、DeploySharp、模型和 OCR 流程，区别在于操作系统对应的 OpenCV 原生库和文件搜索路径。本文的 ORT CPU 运行不需要 PaddlePaddle。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#328c82"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#18354d" flood-opacity=".1"/></filter></defs>
  <rect width="1440" height="780" rx="28" fill="#f4f8fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="78" font-size="42" font-weight="750" fill="#142b43">同一份 C# OCR 代码，换的是 native 运行时</text>
    <text x="62" y="122" font-size="24" fill="#557086">DeploySharp 编排层与模型保持一致，系统和原生库按目标机分别准备</text>
    <g filter="url(#shadow)"><rect x="62" y="183" width="600" height="480" rx="25" fill="#e8f3f1" stroke="#a8cfc4" stroke-width="2"/><rect x="778" y="183" width="600" height="480" rx="25" fill="#e8edf7" stroke="#afc0d7" stroke-width="2"/></g>
    <g text-anchor="middle" fill="#18354d"><text x="362" y="235" font-size="31" font-weight="700">Windows x64</text><text x="1078" y="235" font-size="31" font-weight="700">Ubuntu 22.04 x64</text></g>
    <g fill="#fff" stroke-width="2"><rect x="116" y="275" width="492" height="74" rx="14" stroke="#94c6b8"/><rect x="116" y="377" width="492" height="74" rx="14" stroke="#94c6b8"/><rect x="116" y="479" width="492" height="118" rx="14" stroke="#dfbd98"/><rect x="832" y="275" width="492" height="74" rx="14" stroke="#afc0d7"/><rect x="832" y="377" width="492" height="74" rx="14" stroke="#afc0d7"/><rect x="832" y="479" width="492" height="118" rx="14" stroke="#dfbd98"/></g>
    <g fill="none" stroke="#328c82" stroke-width="4" marker-end="url(#arrow)"><path d="M362 351V367"/><path d="M362 453V469"/><path d="M1078 351V367"/><path d="M1078 453V469"/></g>
    <g text-anchor="middle"><text x="362" y="320" font-size="25" font-weight="700" fill="#18354d">同一 C# 工程</text><text x="362" y="423" font-size="24" font-weight="700" fill="#286e60">Visual.OpenCV + ORT CPU</text><text x="362" y="518" font-size="23" font-weight="700" fill="#985d3d">win-x64 native</text><text x="362" y="556" font-size="21" fill="#557086">OpenCV runtime.win-x64</text><text x="362" y="584" font-size="20" fill="#557086">ORT CPU DLL · PATH / 输出目录</text>
      <text x="1078" y="320" font-size="25" font-weight="700" fill="#18354d">同一 C# 工程</text><text x="1078" y="423" font-size="24" font-weight="700" fill="#385779">Visual.OpenCV + ORT CPU</text><text x="1078" y="518" font-size="23" font-weight="700" fill="#985d3d">linux-x64 native</text><text x="1078" y="556" font-size="21" fill="#557086">OpenCV runtime.ubuntu.22.04-x64</text><text x="1078" y="584" font-size="20" fill="#557086">ORT CPU .so · LD_LIBRARY_PATH</text></g>
    <rect x="60" y="698" width="1320" height="45" rx="12" fill="#e7eef5"/><text x="88" y="727" font-size="21" fill="#29445b">两端都执行 DET → 裁剪 → CLS → REC；这条 ONNX 路径不需要安装 Python 或 PaddlePaddle。</text>
  </g>
</svg>
