<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="800" viewBox="0 0 1410 800" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 2.0.0：在 C# 中运行 PaddleOCR</title>
  <desc id="desc">深蓝青绿的系列教程题图。文档图像进入 C# OCR 流水线，检测、方向分类和识别三个模型共同产生文字、区域和置信度；支持 v4/v5/v6 的按需组合。图形为流程示意，不是真实识别截图。</desc>
