<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">区域归属看底边中心，而不是框是否接触区域</title><desc id="desc">两个示意目标分别展示底边中心在区域内和区域外，右侧说明类别、区域与阈值如何产生待复核事件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#379b8d"/></marker></defs><rect width="1440" height="780" rx="22" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="67" font-size="36" fill="#173047" font-weight="700">区域计数：先统一坐标，再判断底边参考点</text><text x="50" y="112" font-size="23" fill="#586e83" font-weight="400">固定地面视角的近似规则；遮挡和截断会影响参考点，不表示真实三维落地点。</text><rect x="50" y="154" width="690" height="542" rx="18" fill="#e9f0f4" stroke="#c3d6de"/><rect x="130" y="300" width="500" height="310" fill="#f5d793" fill-opacity=".28" stroke="#cb9631" stroke-width="4"/><rect x="250" y="190" width="95" height="200" fill="#fff" fill-opacity=".4" stroke="#26947e" stroke-width="4"/><circle cx="297.5" cy="390" r="9" fill="#26947e"/><rect x="475" y="480" width="95" height="180" fill="#fff" fill-opacity=".4" stroke="#8698a8" stroke-width="4"/><circle cx="522.5" cy="660" r="9" fill="#8698a8"/><text x="150" y="340" font-size="24" fill="#926419" font-weight="650">配置区域</text><text x="366" y="391" font-size="23" fill="#247c68" font-weight="650">底边中心在内</text><text x="361" y="447" font-size="21" fill="#4e6c7d" font-weight="400">中心在外也可命中</text><text x="133" y="659" font-size="22" fill="#5b6f82" font-weight="400">框有重叠，底边中心在外 → 不计入</text><rect x="795" y="170" width="595" height="145" rx="18" fill="#e0f0e9" stroke="#c3d6de"/><text x="822" y="211" font-size="26" fill="#215b51" font-weight="650">① 源图坐标 → 归一化参考点</text><text x="822" y="256" font-size="23" fill="#284b65" font-weight="400">x = (左边 + 宽 / 2) / 原图宽</text><text x="822" y="292" font-size="23" fill="#284b65" font-weight="400">y = 下边 / 原图高</text><rect x="795" y="347" width="595" height="126" rx="18" fill="#e8edf8" stroke="#c3d6de"/><text x="822" y="389" font-size="26" fill="#3c527b" font-weight="650">② 类别过滤 + 多边形 Contains</text><text x="822" y="436" font-size="23" fill="#284b65" font-weight="400">同一区域的人员、车辆规则独立计算</text><rect x="795" y="506" width="595" height="145" rx="18" fill="#fff0dc" stroke="#c3d6de"/><text x="822" y="548" font-size="26" fill="#835b22" font-weight="650">③ count ≥ TriggerAtLeast</text><text x="822" y="590" font-size="23" fill="#284b65" font-weight="400">记录成员 ID 与原因代码</text><text x="822" y="627" font-size="23" fill="#284b65" font-weight="400">生成 pending-human-review 事件</text><path d="M1093 320V336" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><path d="M1093 480V495" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="720" width="1340" height="42" rx="18" fill="#173047" stroke="none"/><text x="79" y="748" font-size="23" fill="#edf6fa" font-weight="400">CLIP 候选匹配不会改变区域计数，也不决定事件是否触发。</text></g></svg>
