<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">三个模型怎样完成一个场景报告</title><desc id="desc">文本候选初始化编码一次，NanoDet 检测之后按源图坐标裁剪 ROI，CLIP 图像真实 Batch 与文本特征进行匹配，返回自定义结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#369a8c"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1440" height="820" rx="20" fill="#f4f7fb" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="68" font-size="36" fill="#173047" font-weight="700">检测回答“在哪里”，CLIP 比较“更像哪段描述”</text><text x="50" y="113" font-size="23" fill="#586e83" font-weight="400">只在你给出的候选描述之间匹配；不会自由生成文本，也没有新增检测类别。</text><rect x="50" y="167" width="285" height="143" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="76" y="211" font-size="27" fill="#173047" font-weight="700">prompts.json</text><text x="76" y="259" font-size="23" fill="#173047" font-weight="400">英文候选 · 按类别分组</text><rect x="410" y="167" width="330" height="143" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="436" y="211" font-size="27" fill="#173047" font-weight="700">CLIP 文本编码器</text><text x="436" y="259" font-size="23" fill="#173047" font-weight="400">BPE · BOS / EOS · 长度 77</text><rect x="815" y="167" width="344" height="143" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="841" y="211" font-size="27" fill="#173047" font-weight="700">[候选数, 512] 特征</text><text x="841" y="259" font-size="23" fill="#173047" font-weight="400">编码一次，ROI 循环复用</text><path d="M351 238H389" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M756 238H793" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="375" width="285" height="177" rx="20" fill="#e2f1e9" stroke="#c2d7da"/><text x="76" y="419" font-size="27" fill="#173047" font-weight="700">NanoDet-Plus</text><text x="76" y="467" font-size="23" fill="#173047" font-weight="400">源图框 + 类别 + 分数</text><text x="76" y="511" font-size="23" fill="#173047" font-weight="400">自定义 Builder / Decoder</text><rect x="410" y="375" width="330" height="177" rx="20" fill="#e2f1e9" stroke="#c2d7da"/><text x="436" y="419" font-size="27" fill="#173047" font-weight="700">ROI → 图像编码器</text><text x="436" y="467" font-size="23" fill="#173047" font-weight="400">共享原图 · Batch ≤ 16</text><text x="436" y="511" font-size="23" fill="#173047" font-weight="400">[区域数, 3, 224, 224]</text><rect x="815" y="375" width="344" height="177" rx="20" fill="#e2f1e9" stroke="#c2d7da"/><text x="841" y="419" font-size="27" fill="#173047" font-weight="700">[区域数, 512] 特征</text><text x="841" y="467" font-size="23" fill="#173047" font-weight="400">L2 归一化 → 相似度</text><text x="841" y="511" font-size="23" fill="#173047" font-weight="400">在对应候选组内比较</text><path d="M351 459H389" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M756 459H793" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M1175 238H1250V604H1040V634" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M987 568V634" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="653" width="1340" height="113" rx="20" fill="#173047" stroke="none"/><text x="81" y="696" font-size="29" fill="#edf6fa" font-weight="700">SceneAnalysisResult</text><text x="81" y="738" font-size="24" fill="#b9d6e2" font-weight="400">目标：检测框 / ROI / 候选 Top-3 / 分差 / 复核标记；保存 JSON、叠框图和 ROI 图。</text></g></svg>
