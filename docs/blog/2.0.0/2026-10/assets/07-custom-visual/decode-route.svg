<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">三模型联合的区域巡检流程</title><desc id="desc">道路和庭院快照复用 NanoDet 检测。几何规则直接触发事件，区域内车辆额外与缓存文本特征做 CLIP 匹配。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#379b8d"/></marker></defs><rect width="1440" height="760" rx="22" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="67" font-size="36" fill="#173047" font-weight="700">检测回答在哪里，规则回答要关注什么</text><text x="50" y="112" font-size="23" fill="#586e83" font-weight="400">车型候选提供复核线索；事件依据保留检测类别、区域、数量和目标 ID。</text><rect x="50" y="176" width="286" height="135" rx="18" fill="#e2edf4" stroke="#c3d6de"/><text x="76" y="216" font-size="25" fill="#173047" font-weight="650">相机 A · 车辆通道</text><text x="76" y="260" font-size="23" fill="#284b65" font-weight="400">0 s / 4 s / 8 s</text><rect x="50" y="338" width="286" height="135" rx="18" fill="#e2edf4" stroke="#c3d6de"/><text x="76" y="378" font-size="25" fill="#173047" font-weight="650">相机 B · 庭院</text><text x="76" y="422" font-size="23" fill="#284b65" font-weight="400">0 s / 4 s / 8 s</text><rect x="418" y="245" width="270" height="168" rx="18" fill="#e0f0e9" stroke="#c3d6de"/><text x="444" y="288" font-size="30" fill="#215b51" font-weight="700">NanoDet-Plus</text><text x="444" y="337" font-size="24" fill="#284b65" font-weight="400">自定义六输出解码</text><text x="444" y="379" font-size="23" fill="#284b65" font-weight="400">源图框 · 类别 · 分数</text><rect x="777" y="245" width="260" height="168" rx="18" fill="#fff0d9" stroke="#c3d6de"/><text x="803" y="288" font-size="30" fill="#835b22" font-weight="700">区域规则</text><text x="803" y="337" font-size="24" fill="#284b65" font-weight="400">底边中心 + 类别</text><text x="803" y="379" font-size="23" fill="#284b65" font-weight="400">多边形 + 数量阈值</text><rect x="1137" y="193" width="253" height="270" rx="18" fill="#e2f1ed" stroke="#c3d6de"/><text x="1162" y="237" font-size="30" fill="#246b5d" font-weight="700">巡检报告</text><text x="1162" y="285" font-size="23" fill="#284b65" font-weight="400">区域统计与事件</text><text x="1162" y="327" font-size="24" fill="#284b65" font-weight="400">JSON / CSV</text><text x="1162" y="369" font-size="23" fill="#284b65" font-weight="400">证据图片</text><text x="1162" y="411" font-size="23" fill="#284b65" font-weight="400">HTML 人工复核</text><path d="M353 243H375V328H395" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><path d="M353 405H375V328" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><path d="M706 328H755" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><path d="M1055 285H1115" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><rect x="438" y="530" width="270" height="105" rx="18" fill="#e6e9f5" stroke="#c3d6de"/><text x="464" y="571" font-size="25" fill="#3e4e77" font-weight="650">CLIP 文本编码器</text><text x="464" y="610" font-size="22" fill="#284b65" font-weight="400">六条车型描述 → 缓存</text><rect x="800" y="509" width="288" height="147" rx="18" fill="#e6e9f5" stroke="#c3d6de"/><text x="826" y="550" font-size="25" fill="#3e4e77" font-weight="650">CLIP 图像编码器</text><text x="826" y="590" font-size="22" fill="#284b65" font-weight="400">仅区域内车辆 ROI Batch</text><text x="826" y="630" font-size="22" fill="#284b65" font-weight="400">与文本特征匹配 Top-3</text><path d="M908 432V485" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><text x="924" y="464" font-size="19" fill="#284b65" font-weight="400">可选语义分支</text><path d="M725 584H778" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><path d="M1106 582H1263V484" fill="none" stroke="#379b8d" stroke-width="4" marker-end="url(#arrow)"/><text x="50" y="713" font-size="24" fill="#586e83" font-weight="400">同一目标在多张截图中可以重复出现；没有跨帧跟踪或事件去重。</text></g></svg>
