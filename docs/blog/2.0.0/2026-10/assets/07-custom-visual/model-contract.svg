<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">NanoDet 的六个输出怎样变成检测框</title><desc id="desc">输入图像产生三个尺度的类别概率与边框分布，执行 DFL 距离期望、坐标还原和按类别 NMS。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#369a8c"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1440" height="820" rx="20" fill="#f4f7fb" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="68" font-size="36" fill="#173047" font-weight="700">先认清输出，再写自己的 Decoder</text><text x="50" y="113" font-size="23" fill="#586e83" font-weight="400">本篇固定的 OpenCV Zoo ONNX 图：三个尺度、六个输出，不根据家族名称猜格式。</text><rect x="50" y="170" width="290" height="458" rx="20" fill="#e0ecef" stroke="#c2d7da"/><text x="76" y="214" font-size="27" fill="#173047" font-weight="700">input.1</text><text x="76" y="262" font-size="23" fill="#173047" font-weight="400">[1, 3, 416, 416]</text><text x="76" y="306" font-size="23" fill="#173047" font-weight="400">FP32 · RGB · NCHW</text><text x="76" y="350" font-size="23" fill="#173047" font-weight="400">黑边 Letterbox 到 416</text><text x="76" y="394" font-size="23" fill="#173047" font-weight="400">输出框还原至源图</text><rect x="430" y="170" width="480" height="128" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="456" y="214" font-size="27" fill="#173047" font-weight="700">stride 8 · 2704 个位置</text><text x="456" y="262" font-size="23" fill="#173047" font-weight="400">792: [1,2704,80]   795: [1,2704,32]</text><rect x="430" y="325" width="480" height="128" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="456" y="369" font-size="27" fill="#173047" font-weight="700">stride 16 · 676 个位置</text><text x="456" y="417" font-size="23" fill="#173047" font-weight="400">814: [1,676,80]   817: [1,676,32]</text><rect x="430" y="480" width="480" height="128" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="456" y="524" font-size="27" fill="#173047" font-weight="700">stride 32 · 169 个位置</text><text x="456" y="572" font-size="23" fill="#173047" font-weight="400">836: [1,169,80]   839: [1,169,32]</text><rect x="1010" y="170" width="378" height="458" rx="20" fill="#e2f1e9" stroke="#c2d7da"/><text x="1036" y="214" font-size="27" fill="#173047" font-weight="700">输出含义 → 业务结果</text><text x="1036" y="262" font-size="23" fill="#173047" font-weight="400">80 类：最大分类概率</text><text x="1036" y="306" font-size="23" fill="#173047" font-weight="400">32 值：四边 × 8 档距离</text><text x="1036" y="350" font-size="23" fill="#173047" font-weight="400">DFL → 每条边的距离期望</text><text x="1036" y="394" font-size="23" fill="#173047" font-weight="400">网格中心 ± 距离 → 框</text><text x="1036" y="438" font-size="23" fill="#173047" font-weight="400">逆向变换 → 源图坐标</text><text x="1036" y="482" font-size="23" fill="#173047" font-weight="400">按类别 NMS → 目标列表</text><path d="M355 395H407" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M929 395H989" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="682" width="1338" height="87" rx="20" fill="#173047" stroke="none"/><text x="82" y="720" font-size="25" fill="#eaf4f8" font-weight="400">分数已是概率，不重复 Sigmoid；边框仍是 logit，需要逐边 Softmax。</text><text x="82" y="753" font-size="23" fill="#b8d5e2" font-weight="400">自有 ObjectDetections，无需修改主库；不套用 YOLO 后处理。</text></g></svg>
