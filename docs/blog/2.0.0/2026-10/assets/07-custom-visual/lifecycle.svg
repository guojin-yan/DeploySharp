<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">多模型的生命周期与数据复用</title><desc id="desc">注册中心拥有后端资源，模型会话在循环外创建，原图只解码一次，临时输入按批释放，结果使用自己的数组。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#369a8c"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1440" height="800" rx="20" fill="#f4f7fb" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="68" font-size="36" fill="#173047" font-weight="700">Session 放在循环外，输入和临时资源按批释放</text><text x="50" y="113" font-size="23" fill="#586e83" font-weight="400">先等待 await 完成，再释放输入与 Session；业务结果保留自己的数组、数值和字符串。</text><rect x="50" y="162" width="1340" height="482" rx="20" fill="#e8edf8" stroke="#becde3"/><text x="81" y="206" font-size="26" fill="#173047" font-weight="700">BackendRegistry · 最后释放</text><rect x="80" y="239" width="390" height="363" rx="20" fill="#fff" stroke="#c2d7da"/><text x="106" y="283" font-size="27" fill="#173047" font-weight="700">初始化阶段</text><text x="106" y="331" font-size="23" fill="#173047" font-weight="400">创建检测 Runner</text><text x="106" y="375" font-size="23" fill="#173047" font-weight="400">文本 Session → 编码候选</text><text x="106" y="419" font-size="23" fill="#173047" font-weight="400">释放文本 Session，保留特征</text><text x="106" y="463" font-size="23" fill="#173047" font-weight="400">创建 CLIP 图像 Runner</text><text x="106" y="507" font-size="23" fill="#173047" font-weight="400">避免为每个目标重载三个模型</text><rect x="500" y="239" width="438" height="363" rx="20" fill="#fff" stroke="#c2d7da"/><text x="526" y="283" font-size="27" fill="#173047" font-weight="700">单张图片 / 多批 ROI</text><text x="526" y="331" font-size="23" fill="#173047" font-weight="400">DecodeForRois → 解码一次</text><text x="526" y="375" font-size="23" fill="#173047" font-weight="400">检测 → 源图坐标 → 有界 ROI</text><text x="526" y="419" font-size="23" fill="#173047" font-weight="400">PrepareBatch → 推理 → 解码</text><text x="526" y="463" font-size="23" fill="#173047" font-weight="400">Runner 释放每批已准备输入</text><text x="526" y="507" font-size="23" fill="#173047" font-weight="400">原图保持存活直到全部批次结束</text><rect x="968" y="239" width="392" height="363" rx="20" fill="#fff" stroke="#c2d7da"/><text x="994" y="283" font-size="27" fill="#173047" font-weight="700">业务输出阶段</text><text x="994" y="331" font-size="23" fill="#173047" font-weight="400">复制并归一化 512 维特征</text><text x="994" y="375" font-size="23" fill="#173047" font-weight="400">相似度与 Top-3 → 自有结果</text><text x="994" y="419" font-size="23" fill="#173047" font-weight="400">保存 JSON、叠框图、ROI 图</text><text x="994" y="463" font-size="23" fill="#173047" font-weight="400">释放原图、两个 Runner</text><text x="994" y="507" font-size="23" fill="#173047" font-weight="400">不保留后端借用缓冲区</text><rect x="50" y="688" width="1340" height="67" rx="20" fill="#173047" stroke="none"/><text x="81" y="730" font-size="24" fill="#edf6fa" font-weight="400">RunAsync 是异步调用入口；本篇依次执行，不把它解释成自动跨帧并发或 Session 池。</text></g></svg>
