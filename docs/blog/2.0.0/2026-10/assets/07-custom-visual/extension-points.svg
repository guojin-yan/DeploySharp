<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">单个新模型的四个接入点</title><desc id="desc">自定义输入经过前处理进入后端推理，输出由自定义解码器转成自己的结果。Builder 组合这些组件。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#329b8b"/></marker></defs><rect width="1440" height="700" rx="24" fill="#f3f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17354a"><text x="48" y="72" font-size="36" font-weight="700">新模型的差异，留在自己的工程中</text><text x="48" y="119" font-size="24" fill="#607b8d">Builder 连接输入、张量准备、推理后端和结果解码。</text>
<g stroke="#b7cdd8" stroke-width="2"><rect x="48" y="210" width="283" height="250" rx="24" fill="#e5edf8"/><rect x="397" y="210" width="283" height="250" rx="24" fill="#dff1eb"/><rect x="746" y="210" width="283" height="250" rx="24" fill="#e5edf8"/><rect x="1095" y="210" width="297" height="250" rx="24" fill="#fcf0df"/></g>
<text x="78" y="264" font-size="29" font-weight="700">自己的输入</text><text x="78" y="326" font-size="24">OpenCV 图像对象</text><text x="78" y="371" font-size="24">原图尺寸与所有权</text><text x="78" y="420" font-size="27" fill="#64839c">TInput</text>
<text x="425" y="264" font-size="29" font-weight="700">前处理</text><text x="425" y="326" font-size="24">几何 / 颜色 / 归一化</text><text x="425" y="371" font-size="24">Tensor + Transform</text><text x="425" y="420" font-size="27" fill="#318c75">[1,3,416,416]</text>
<text x="773" y="264" font-size="29" font-weight="700">推理后端</text><text x="773" y="326" font-size="24">ORT / OpenVINO</text><text x="773" y="371" font-size="24">执行 NanoDet ONNX</text><text x="773" y="420" font-size="27" fill="#64839c">六个输出张量</text>
<text x="1122" y="264" font-size="29" font-weight="700">自己的 Decoder</text><text x="1122" y="326" font-size="24">DFL / 源图框 / NMS</text><text x="1122" y="371" font-size="24">类别、分数、坐标</text><text x="1122" y="420" font-size="27" fill="#ad7546">TResult</text>
<g stroke="#329b8b" stroke-width="4" marker-end="url(#a)"><path d="M342 334H382"/><path d="M691 334H731"/><path d="M1040 334H1080"/></g><rect x="48" y="525" width="1344" height="110" rx="20" fill="#173c50"/><text x="80" y="568" font-size="26" fill="#e7f4f6">VisualModelDefinitionBuilder&lt;OpenCvDecodedRoiImage, ObjectDetections&gt;</text><text x="80" y="610" font-size="23" fill="#b4d6df">应用维护图像与 Runner；Runner 释放每次前处理返回的推理输入。</text></g></svg>
