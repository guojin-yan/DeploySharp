<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">YOLO26 从原图到原图坐标的完整数据流</title>
  <desc id="desc">原图经过 Resize、Letterbox 或 CenterCrop 之一，转换为 RGB NCHW 张量，交给选定后端执行，再由端到端输出 decoder 过滤分数、映射类别并依据变换信息还原到原图坐标。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#328c82"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#18354d" flood-opacity=".1"/></filter></defs>
  <rect width="1440" height="780" rx="28" fill="#f4f8fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="78" font-size="43" font-weight="750" fill="#142b43">YOLO26：输入变换与结果坐标是一条链</text>
    <text x="62" y="122" font-size="24" fill="#557086">模型只看到固定输入，应用仍要把结果准确放回原图</text>
    <g filter="url(#shadow)">
      <rect x="55" y="190" width="215" height="254" rx="20" fill="#e7eff6" stroke="#afc3d4" stroke-width="2"/>
      <rect x="320" y="190" width="270" height="254" rx="20" fill="#e3f1ee" stroke="#a7cfc3" stroke-width="2"/>
      <rect x="640" y="190" width="220" height="254" rx="20" fill="#e8edf7" stroke="#afc0d7" stroke-width="2"/>
      <rect x="910" y="190" width="220" height="254" rx="20" fill="#f3eaf8" stroke="#ccb7d8" stroke-width="2"/>
      <rect x="1180" y="190" width="205" height="254" rx="20" fill="#e4f2e9" stroke="#a7cdb8" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#328c82" stroke-width="4" marker-end="url(#arrow)"><path d="M276 317H309"/><path d="M596 317H629"/><path d="M866 317H899"/><path d="M1136 317H1169"/></g>
    <g text-anchor="middle" fill="#18354d">
      <text x="162" y="239" font-size="27" font-weight="700">原图</text><text x="162" y="279" font-size="22">810 × 1080</text><rect x="102" y="303" width="120" height="102" rx="8" fill="#fff" stroke="#9db7c7" stroke-width="2"/><path d="M118 329H201M118 353H186M118 377H204" stroke="#91acbb" stroke-width="6" stroke-linecap="round"/><text x="162" y="427" font-size="18" fill="#557086">保留原始尺寸</text>
      <text x="455" y="239" font-size="27" font-weight="700">图像前处理</text><text x="455" y="279" font-size="21">Resize / Letterbox / CenterCrop</text><text x="455" y="317" font-size="21" fill="#557086">RGB · Float32 · NCHW</text><rect x="368" y="345" width="174" height="54" rx="10" fill="#fff" stroke="#94c6b8" stroke-width="2"/><text x="455" y="379" font-size="22" fill="#286e60">640 × 640</text><text x="455" y="427" font-size="18" fill="#557086">记录缩放与填充</text>
      <text x="750" y="239" font-size="27" font-weight="700">后端执行</text><text x="750" y="281" font-size="21">ORT / OpenVINO</text><text x="750" y="317" font-size="21">OpenCV DNN / TRT</text><text x="750" y="371" font-size="20" fill="#557086">输入合同匹配</text><text x="750" y="407" font-size="20" fill="#557086">输出端到端检测行</text>
      <text x="1020" y="239" font-size="27" font-weight="700">decoder</text><text x="1020" y="281" font-size="21">读取 [x1,y1,x2,y2]</text><text x="1020" y="317" font-size="21">score / class_id</text><text x="1020" y="371" font-size="20" fill="#557086">阈值过滤</text><text x="1020" y="407" font-size="20" fill="#557086">类别表映射</text>
      <text x="1282" y="239" font-size="27" font-weight="700">原图结果</text><text x="1282" y="281" font-size="22">DetectionResult</text><text x="1282" y="329" font-size="20" fill="#557086">坐标还原</text><text x="1282" y="365" font-size="20" fill="#557086">直接绘制</text><text x="1282" y="407" font-size="20" fill="#557086">保存 JSON</text>
    </g>
    <rect x="60" y="510" width="1320" height="170" rx="22" fill="#183c50"/>
    <text x="94" y="558" font-size="30" font-weight="700" fill="#f1fafb">坐标还原的核心</text>
    <text x="94" y="604" font-size="24" fill="#cce4e7">Letterbox：先减去 padding，再除以 scale；Resize：按宽高比例分别还原；CenterCrop：加回裁剪偏移。</text>
    <text x="94" y="646" font-size="22" fill="#bdd9e2">PreparedVisualInput 保存本次变换，decoder 使用它把模型坐标还原为原图像素。</text>
    <text x="60" y="735" font-size="22" fill="#557086">因此绘制 DetectionResult 时不要再次乘缩放比例，否则会发生二次变换。</text>
  </g>
</svg>
