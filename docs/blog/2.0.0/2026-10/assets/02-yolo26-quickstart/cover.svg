<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="800" viewBox="0 0 1410 800" role="img" aria-labelledby="title desc">
  <title id="title">DeploySharp 2.0.0：在 C# 中部署 YOLO26</title>
  <desc id="desc">深蓝、青绿的系列技术海报。上方是项目名称与 YOLO26 实战主题，中间以本地 ONNX 和图像输入、C# CPU 推理模块、检测框结果说明部署过程，下方突出按需安装、本地模型、内置前后处理与原图坐标。图形为流程示意，非真实检测截图。</desc>
