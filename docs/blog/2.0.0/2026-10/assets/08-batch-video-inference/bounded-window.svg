<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">有界窗口，让像素与张量占用可控</title><desc id="desc">本例逐窗口等待交付，优先保证有序结果和清楚的资源边界。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="780" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">有界窗口，让像素与张量占用可控</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">本例逐窗口等待交付，优先保证有序结果和清楚的资源边界。</text><rect x="48" y="178" width="1344" height="151" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="224" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">当前窗口：最多 12 个独立 Mat</text><text x="72" y="268" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">只读当前窗口，完成后推进下一窗口。结果元数据由应用另行保存。</text><rect x="48" y="387" width="300" height="180" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="433" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">读取像素</text><text x="72" y="477" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">FFmpeg → BGR</text><text x="72" y="515" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">12 帧为上限</text><rect x="396" y="387" width="300" height="180" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="420" y="433" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">准备 / 推理</text><text x="420" y="477" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">池容量 + 预取量</text><text x="420" y="515" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">限制在途项目</text><rect x="744" y="387" width="300" height="180" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="768" y="433" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">按源序取结果</text><text x="768" y="477" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">F0、F1、F2…</text><text x="768" y="515" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">跟踪器可顺序消费</text><rect x="1092" y="387" width="300" height="180" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="1116" y="433" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">释放当前帧</text><text x="1116" y="477" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">await 全部退出</text><text x="1116" y="515" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">归还输入租约</text><path d="M361 474L384 474" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M709 474L732 474" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1057 474L1080 474" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1240 590V665H195V590" fill="none" stroke="#198f83" stroke-width="4" marker-end="url(#a)"/><text x="720" y="711" font-size="27" fill="#173b50" font-weight="650" text-anchor="middle">下一窗口继续；像素缓冲不随视频总帧数无限增长</text></g></svg>