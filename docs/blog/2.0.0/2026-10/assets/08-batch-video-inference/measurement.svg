<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="917" viewBox="0 0 1440 917" role="img" aria-labelledby="title desc"><title id="title">把测量边界画清楚，再比较调度方式</title><desc id="desc">读取包含解码等待；解码进程与推理之间还有有界操作系统管道。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="917" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">把测量边界画清楚，再比较调度方式</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">读取包含解码等待；解码进程与推理之间还有有界操作系统管道。</text><rect x="48" y="177" width="1344" height="133" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="223" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">计时之前</text><text x="72" y="267" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">加载模型、创建 Session、启动解码器、两个窗口预热。</text><rect x="48" y="350" width="1344" height="261" rx="18" fill="#e1f3ee" stroke="#9acabd" stroke-width="2"/><text x="76" y="400" font-size="32" fill="#173b50" font-weight="700" text-anchor="start">计时窗口：12 帧</text><rect x="76" y="444" width="286" height="104" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="95" y="505" font-size="26" fill="#173b50" font-weight="650" text-anchor="start">BGR 管道读取</text><path d="M374 493L391 493" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="406" y="444" width="286" height="104" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="425" y="505" font-size="26" fill="#173b50" font-weight="650" text-anchor="start">前处理</text><path d="M704 493L721 493" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="736" y="444" width="286" height="104" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="755" y="505" font-size="26" fill="#173b50" font-weight="650" text-anchor="start">调度 + 推理</text><path d="M1034 493L1051 493" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1066" y="444" width="286" height="104" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="1085" y="505" font-size="26" fill="#173b50" font-weight="650" text-anchor="start">结果解码 / 提取</text><rect x="48" y="657" width="1344" height="133" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="703" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">计时之后</text><text x="72" y="747" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">另外读取预览帧、绘框、保存 JSON / JPEG；不混入吞吐时间。</text><text x="48" y="855" font-size="26" fill="#5e788a" font-weight="400" text-anchor="start">FPS = 48 ÷ 三轮总耗时中位数；P50 / P95 = 窗口完成耗时，不是单帧延迟。</text></g></svg>