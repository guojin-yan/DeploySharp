<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="831" viewBox="0 0 1440 831" role="img" aria-labelledby="title desc"><title id="title">真正 Batch：张量与逐帧坐标一起成批</title><desc id="desc">本次动态导出在运行时使用 [B,3,640,640] → [B,300,6]。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="831" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">真正 Batch：张量与逐帧坐标一起成批</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">本次动态导出在运行时使用 [B,3,640,640] → [B,300,6]。</text><rect x="48" y="181" width="300" height="139" rx="12" fill="#deecef" stroke="#9ebdca" stroke-width="2"/><path d="M78 296.37L144 240.76999999999998L204 276.90999999999997L267 221.31L318 296.37" stroke="#83a4b4" stroke-width="3" fill="none"/><text x="61" y="209" font-size="22" fill="#173b50" font-weight="650" text-anchor="start">Frame 0</text><rect x="395" y="181" width="300" height="139" rx="12" fill="#deecef" stroke="#9ebdca" stroke-width="2"/><path d="M425 296.37L491 240.76999999999998L551 276.90999999999997L614 221.31L665 296.37" stroke="#83a4b4" stroke-width="3" fill="none"/><text x="408" y="209" font-size="22" fill="#173b50" font-weight="650" text-anchor="start">Frame 1</text><rect x="742" y="181" width="300" height="139" rx="12" fill="#deecef" stroke="#9ebdca" stroke-width="2"/><path d="M772 296.37L838 240.76999999999998L898 276.90999999999997L961 221.31L1012 296.37" stroke="#83a4b4" stroke-width="3" fill="none"/><text x="755" y="209" font-size="22" fill="#173b50" font-weight="650" text-anchor="start">Frame 2</text><rect x="1089" y="181" width="300" height="139" rx="12" fill="#deecef" stroke="#9ebdca" stroke-width="2"/><path d="M1119 296.37L1185 240.76999999999998L1245 276.90999999999997L1308 221.31L1359 296.37" stroke="#83a4b4" stroke-width="3" fill="none"/><text x="1102" y="209" font-size="22" fill="#173b50" font-weight="650" text-anchor="start">Frame 3</text><path d="M720 344L720 389" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="48" y="414" width="616" height="196" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="460" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">一个连续输入张量</text><text x="72" y="504" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">[4,3,640,640]</text><text x="72" y="542" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">四行直接写入，BatchFrames 保存几何</text><rect x="756" y="414" width="636" height="196" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="780" y="460" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">一个 Batch 输出</text><text x="780" y="504" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">[4,300,6]</text><text x="780" y="542" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">检测结果逐行还原到对应原图</text><path d="M690 506L736 506" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="48" y="655" width="1344" height="120" rx="18" fill="#fff4e7" stroke="#e9cda5" stroke-width="2"/><text x="74" y="701" font-size="29" fill="#173b50" font-weight="650" text-anchor="start">尾批按实际帧数执行</text><text x="74" y="745" font-size="25" fill="#5e788a" font-weight="400" text-anchor="start">4 帧 → DetectionBatchResult；1 帧 → DetectionResult；必须使用支持这些 Batch 的模型。</text></g></svg>