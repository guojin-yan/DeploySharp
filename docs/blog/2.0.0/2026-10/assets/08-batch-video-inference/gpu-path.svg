<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="941" viewBox="0 0 1440 941" role="img" aria-labelledby="title desc"><title id="title">GPU 后端：调度接口相同，运行环境分别配置</title><desc id="desc">Engine 构建与 Session 初始化在计时外；不把预取写成 CUDA 零拷贝。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="941" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">GPU 后端：调度接口相同，运行环境分别配置</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">Engine 构建与 Session 初始化在计时外；不把预取写成 CUDA 零拷贝。</text><rect x="48" y="177" width="1344" height="130" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="223" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">相同的输入准备</text><text x="72" y="267" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">FFmpeg → BGR Mat → Letterbox / RGB / FP32 NCHW</text><path d="M392 326L392 365" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1040 326L1040 365" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="48" y="390" width="640" height="220" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="436" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">ORT CUDA Provider</text><text x="72" y="480" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">ORT 1.28.0 官方 CUDA 12 原生库</text><text x="72" y="518" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">use_tf32 = 0</text><text x="72" y="556" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">独立 Session / 动态 Batch</text><rect x="752" y="390" width="640" height="220" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="776" y="436" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">TensorRT 本机 Engine</text><text x="776" y="480" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">Windows TRT 10 / Ubuntu TRT 11</text><text x="776" y="518" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">FP32 · 关闭 TF32 · opt Batch=4</text><text x="776" y="556" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">动态范围：1 ≤ Batch ≤ 4</text><path d="M392 629L392 669" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1040 629L1040 669" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="48" y="694" width="1344" height="130" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="740" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">输出回到 CPU Decoder</text><text x="72" y="784" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">按源帧编号还原检测框；窗口退出后归还输入租约。</text><text x="48" y="883" font-size="26" fill="#5e788a" font-weight="400" text-anchor="start">本篇 GPU 加速模型执行；输入上传、输出回读及 CPU 前后处理均计入完整流程。</text></g></svg>