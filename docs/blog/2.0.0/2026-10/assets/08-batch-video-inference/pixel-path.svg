<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="748" viewBox="0 0 1440 748" role="img" aria-labelledby="title desc"><title id="title">从视频像素直接准备模型输入</title><desc id="desc">不经过 JPEG 编码 / 再解码，缓冲在推理退出后才归还。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="748" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">从视频像素直接准备模型输入</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">不经过 JPEG 编码 / 再解码，缓冲在推理退出后才归还。</text><rect x="48" y="205" width="248" height="240" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="251" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">原视频</text><text x="72" y="295" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">FFmpeg CPU 解码</text><text x="72" y="333" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">单解码线程</text><path d="M307 321L316 321" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="328" y="205" width="248" height="240" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="352" y="251" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">独立 Mat</text><text x="352" y="295" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">BGR / UInt8</text><text x="352" y="333" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">管道直接写像素</text><path d="M587 321L596 321" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="608" y="205" width="248" height="240" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="632" y="251" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">Resize</text><text x="632" y="295" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">等比缩放</text><text x="632" y="333" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">中心填充 114</text><path d="M867 321L876 321" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="888" y="205" width="248" height="240" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="912" y="251" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">格式写入</text><text x="912" y="295" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">RGB / ÷255</text><text x="912" y="333" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">按通道直接写</text><path d="M1147 321L1156 321" stroke="#198f83" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1168" y="205" width="248" height="240" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="1192" y="251" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">最终张量</text><text x="1192" y="295" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">FP32 / NCHW</text><text x="1192" y="333" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">Owned 缓冲租约</text><rect x="48" y="513" width="1344" height="173" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="559" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">Batch 按行写入同一份目标缓冲</text><text x="72" y="603" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">每行仍保留独立的源图尺寸、变换与帧编号。</text><text x="72" y="641" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">格式转换需要写入模型张量；本例避免额外整帧编码和批张量拼接。</text></g></svg>