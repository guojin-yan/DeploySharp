<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="918" viewBox="0 0 1440 918" role="img" aria-labelledby="title desc"><title id="title">每块缓冲只在明确的边界归还</title><desc id="desc">输入所有权和视频帧所有权分开处理，避免提前回收造成结果错位。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#198f83"/></marker><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/></filter><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0d2438"/><stop offset="1" stop-color="#163f53"/></linearGradient></defs><rect width="1440" height="918" rx="24" fill="#f2f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="70" font-size="37" fill="#173b50" font-weight="750" text-anchor="start">每块缓冲只在明确的边界归还</text><text x="48" y="119" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">输入所有权和视频帧所有权分开处理，避免提前回收造成结果错位。</text><rect x="48" y="177" width="1344" height="201" rx="18" fill="#fff" stroke="#c9dce5" stroke-width="2"/><text x="72" y="223" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">RunManyAsync：调用方拥有输入</text><text x="72" y="267" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">准备窗口输入 → await RunManyAsync → finally Dispose 每个输入。</text><text x="72" y="305" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">即使方法失败，也先等活动 worker 退出，再归还缓冲。</text><rect x="48" y="411" width="1344" height="201" rx="18" fill="#e1f3ee" stroke="#c9dce5" stroke-width="2"/><text x="72" y="457" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">RunPrefetchedAsync：回调返回 Owned 输入</text><text x="72" y="501" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">准备回调租用缓冲 → 交给库 → 推理退出后由库 Dispose。</text><text x="72" y="539" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">Borrowed 输入仍归调用方；回调返回后不能马上复用底层数组。</text><rect x="48" y="645" width="1344" height="145" rx="18" fill="#fff4e7" stroke="#c9dce5" stroke-width="2"/><text x="72" y="691" font-size="29" fill="#173b50" font-weight="700" text-anchor="start">窗口中的 Mat</text><text x="72" y="735" font-size="24" fill="#5e788a" font-weight="400" text-anchor="start">待该窗口推理全部退出后释放；下一次读取不能覆盖正在使用的像素。</text><text x="48" y="856" font-size="26" fill="#5e788a" font-weight="400" text-anchor="start">结果只保留帧号、类别、分数和框；超长任务可在窗口结束时写出元数据。</text></g></svg>