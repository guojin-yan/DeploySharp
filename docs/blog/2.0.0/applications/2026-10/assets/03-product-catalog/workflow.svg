<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">商品图片的多模型处理流程</title><desc id="desc">原图共享给 RMBG 和 OCR，Alpha 确定主体范围用于 CLIP 裁剪，并辅助标记 OCR 文字归属，输出透明图片与可复核图册。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#329b8b"/></marker></defs><rect width="1440" height="850" rx="24" fill="#f3f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17354a"><text x="48" y="72" font-size="36" font-weight="700">一张原图，得到素材、候选与可见文字</text><text x="48" y="120" font-size="24" fill="#607b8d">候选文本启动时编码一次；每张图复用模型 Session。</text>
<rect x="48" y="320" width="245" height="166" rx="22" fill="#e4edf7" stroke="#b7cdd8"/><text x="75" y="374" font-size="29" font-weight="700">商品原图</text><text x="75" y="425" font-size="24">共享解码像素</text><text x="75" y="462" font-size="22" fill="#607b8d">保留原始文件</text>
<rect x="379" y="200" width="340" height="174" rx="22" fill="#e0f1e9" stroke="#acd1bf"/><text x="406" y="253" font-size="29" font-weight="700">RMBG 1.4</text><text x="406" y="305" font-size="24">Alpha → 主体范围</text><text x="406" y="346" font-size="23">透明图与白底合成</text>
<rect x="804" y="200" width="338" height="174" rx="22" fill="#e5edf8" stroke="#b7cdd8"/><text x="831" y="253" font-size="29" font-weight="700">CLIP</text><text x="831" y="305" font-size="24">主体 ROI ↔ 文本候选</text><text x="831" y="346" font-size="23">Top-3 与候选分差</text>
<rect x="379" y="500" width="340" height="160" rx="22" fill="#fff0de" stroke="#ddc3a3"/><text x="406" y="553" font-size="29" font-weight="700">PP-OCR DET + REC</text><text x="406" y="605" font-size="24">读取原图上的文字</text><text x="406" y="642" font-size="23">保留坐标与置信度</text>
<rect x="804" y="500" width="338" height="160" rx="22" fill="#e4edf7" stroke="#b7cdd8"/><text x="831" y="553" font-size="29" font-weight="700">文字归属</text><text x="831" y="605" font-size="24">中心点 Alpha ≥ 0.2</text><text x="831" y="642" font-size="23">同时保留全部 OCR</text>
<rect x="1210" y="309" width="188" height="213" rx="22" fill="#173c50"/><text x="1237" y="366" font-size="27" fill="#e2f3ed" font-weight="700">商品图册</text><text x="1237" y="414" font-size="23" fill="#bfdae1">素材下载</text><text x="1237" y="454" font-size="23" fill="#bfdae1">检索与复核</text><text x="1237" y="494" font-size="23" fill="#bfdae1">CSV / JSON</text>
<g fill="none" stroke="#329b8b" stroke-width="4" marker-end="url(#a)"><path d="M305 373H335V285H363"/><path d="M305 438H335V578H363"/><path d="M731 286H788"/><path d="M731 580H788"/><path d="M1154 286H1176V365H1194"/><path d="M1154 580H1176V468H1194"/></g><path d="M551 385V482" stroke="#b78552" stroke-width="3" stroke-dasharray="8 8"/><text x="574" y="444" font-size="22" fill="#9e7449">Alpha 辅助</text><text x="48" y="791" font-size="24" fill="#607b8d">分类分数是给定候选组内的相对匹配；OCR 提取可见文字，不自动生成价格、品牌或 SKU。</text></g></svg>
