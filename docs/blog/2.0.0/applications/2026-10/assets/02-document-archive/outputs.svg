<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">文档工作台的结果组织</title><desc id="desc">整批索引关联分组文档、页面和模型产物。复核清单与字段候选保留来源，可以接入业务系统。</desc><rect width="1440" height="860" rx="24" fill="#f3f7fb"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17354a"><text x="48" y="70" font-size="36" font-weight="700">同一份结果，供界面、归档和业务系统使用</text><text x="48" y="118" font-size="24" fill="#607b8d">PageId / DocumentId / RegionIndex 关联内容与来源。</text>
<rect x="48" y="166" width="650" height="240" rx="22" fill="#e0f1e9"/><text x="78" y="219" font-size="29" font-weight="700">整批索引与分组文档</text><text x="78" y="269" font-size="25">archive.json + documents/*.md</text><text x="78" y="319" font-size="24">4 组资料 / 9 页 / 72 区域</text><text x="78" y="365" font-size="23">按组汇总文字、公式与表格链接</text>
<rect x="742" y="166" width="650" height="240" rx="22" fill="#e4edf7"/><text x="772" y="219" font-size="29" font-weight="700">页面与来源坐标</text><text x="772" y="269" font-size="25">source.png / upright.png / page.json</text><text x="772" y="319" font-size="24">Polygon：正向页</text><text x="772" y="365" font-size="24">SourcePolygon：解码原图</text>
<rect x="48" y="442" width="650" height="240" rx="22" fill="#ece8f5"/><text x="78" y="495" font-size="29" font-weight="700">表格与公式任务</text><text x="78" y="545" font-size="25">table-XX/ · formula-XX/</text><text x="78" y="595" font-size="24">裁图 / HTML / LaTeX / 任务 JSON</text><text x="78" y="641" font-size="23">表格成功填字或保留诊断，分别记录</text>
<rect x="742" y="442" width="650" height="240" rx="22" fill="#fff1df"/><text x="772" y="495" font-size="29" font-weight="700">复核与字段候选</text><text x="772" y="545" font-size="25">review.json/csv · fields.json/csv</text><text x="772" y="595" font-size="24">17 个复核项 / 3 个规则候选</text><text x="772" y="641" font-size="23">JSON 含原图位置；候选不等于业务字段</text>
<rect x="48" y="729" width="1344" height="78" rx="18" fill="#173c50"/><text x="78" y="778" font-size="26" fill="#d8f0e9">index.html 将这些结果组织为可搜索、可定位的静态工作台。</text></g></svg>
