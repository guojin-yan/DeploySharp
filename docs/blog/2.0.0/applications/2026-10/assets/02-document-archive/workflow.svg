<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
<title id="title">智能文档工作台：校正、分流、定位与归档</title><desc id="desc">九张混合页面先处理方向并获取版面，再分别进行OCR、表格和公式识别，结果映射回原图后分组保存并进入复核。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#329b8b"/></marker></defs>
<rect width="1440" height="970" rx="24" fill="#f3f7fb"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17354a">
<text x="48" y="70" font-size="36" font-weight="700">整批输入，按内容走不同的模型</text>
<text x="48" y="119" font-size="24" fill="#607b8d">报刊 / 论文 / 表格 / 倒置页 / 现场图 → 同一个工作台</text>
<rect x="48" y="161" width="1344" height="123" rx="22" fill="#e4edf7" stroke="#b7cdd8"/>
<text x="76" y="208" font-size="29" font-weight="700">页面清单 → 文档方向校正 → PP-DocLayout-L 版面分区</text>
<text x="76" y="253" font-size="23">已知任务可直接 text / table / formula；图像类区域保留位置。</text>
<rect x="48" y="354" width="428" height="246" rx="22" fill="#e0f1e9" stroke="#acd1bf"/>
<text x="76" y="406" font-size="30" font-weight="700">文字区域</text>
<text x="76" y="455" font-size="25">PP-OCRv5 DET + REC</text><text x="76" y="501" font-size="23">区域检测 → 文字行 → 识别</text><text x="76" y="550" font-size="23">文字 / 分数 / 正向页坐标</text>
<rect x="506" y="354" width="428" height="246" rx="22" fill="#fff1df" stroke="#ddc3a3"/>
<text x="534" y="406" font-size="30" font-weight="700">表格区域</text>
<text x="534" y="455" font-size="25">分类 → cell + SLANeXt</text><text x="534" y="501" font-size="23">结构对齐 → 单格或多行 OCR</text><text x="534" y="550" font-size="23">填字 HTML / 失败诊断</text>
<rect x="964" y="354" width="428" height="246" rx="22" fill="#ece8f5" stroke="#c8bddf"/>
<text x="992" y="406" font-size="30" font-weight="700">公式区域</text>
<text x="992" y="455" font-size="25">PP-FormulaNet_plus-S</text><text x="992" y="501" font-size="23">官方 tokenizer → LaTeX</text><text x="992" y="550" font-size="23">裁图 / 解码结果 / 语法检查</text>
<rect x="48" y="675" width="1344" height="83" rx="19" fill="#dfeef1"/><text x="77" y="726" font-size="27" font-weight="650">正向页 → 原图坐标　　低分 / 空文字 / 结构与公式异常 → 复核清单</text>
<rect x="48" y="810" width="1344" height="98" rx="22" fill="#173c50"/><text x="78" y="852" fill="#d8f0e9" font-size="29" font-weight="700">可搜索 HTML 工作台 + 分组 Markdown + JSON / CSV</text><text x="78" y="889" fill="#c0dce3" font-size="22">按文档组、状态和文字筛选；点击结果定位原图。</text>
<g fill="none" stroke="#329b8b" stroke-width="4" marker-end="url(#a)"><path d="M262 296V338"/><path d="M720 296V338"/><path d="M1178 296V338"/><path d="M262 611V658"/><path d="M720 611V658"/><path d="M1178 611V658"/><path d="M720 768V796"/></g></g></svg>
