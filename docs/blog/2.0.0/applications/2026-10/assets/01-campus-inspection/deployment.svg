<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">安装引擎与准备模型分别完成</title><desc id="desc">NuGet 提供托管模型部署接口和对应系统的原生库。NanoDet 与 CLIP 的三个 ONNX 图、CLIP 词表和候选配置分别放在工程的模型目录与配置文件中。更换系统选择原生库，更换模型同步输入输出和解码。</desc><rect width="1440" height="820" rx="24" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="68" font-size="36" fill="#173047" font-weight="700">运行时跟随设备，模型文件跟随任务</text><text x="50" y="113" font-size="23" fill="#586e83" font-weight="400">NuGet 不捆绑这三个模型权重；Windows / Ubuntu 切换原生包，业务代码与模型路径保持一致。</text><rect x="50" y="170" width="410" height="478" rx="24" fill="#e0ecef" stroke="#c1d5dc"/><text x="77" y="221" font-size="29" fill="#173047" font-weight="700">托管接口</text><text x="77" y="288" font-size="23" fill="#173047" font-weight="400">Visual.OpenCV 2.0.0</text><text x="77" y="355" font-size="23" fill="#173047" font-weight="400">Backend.OnnxRuntime 2.0.0</text><text x="77" y="422" font-size="23" fill="#173047" font-weight="400">Backend.OpenVINO 2.0.0</text><text x="77" y="489" font-size="23" fill="#173047" font-weight="400">Microsoft.ML.Tokenizers</text><text x="77" y="556" font-size="23" fill="#173047" font-weight="400">图像适配、模型定义、结果解码</text><rect x="490" y="170" width="420" height="478" rx="24" fill="#e8edf8" stroke="#c1d5dc"/><text x="517" y="221" font-size="29" fill="#173047" font-weight="700">原生运行时</text><text x="517" y="288" font-size="23" fill="#173047" font-weight="400">Windows x64 / Ubuntu 22.04</text><text x="517" y="355" font-size="23" fill="#173047" font-weight="400">OpenCV 5.0.0</text><text x="517" y="422" font-size="23" fill="#173047" font-weight="400">ORT CPU 1.28.0</text><text x="517" y="489" font-size="23" fill="#173047" font-weight="400">OpenVINO 2026.2.1 / 2026.3.1</text><text x="517" y="556" font-size="23" fill="#173047" font-weight="400">与设备和操作系统匹配</text><rect x="940" y="170" width="450" height="478" rx="24" fill="#e1f1e9" stroke="#c1d5dc"/><text x="967" y="221" font-size="29" fill="#173047" font-weight="700">模型与业务文件</text><text x="967" y="288" font-size="23" fill="#173047" font-weight="400">NanoDet ONNX · 1 个图</text><text x="967" y="355" font-size="23" fill="#173047" font-weight="400">CLIP ONNX · 图像图 + 文本图</text><text x="967" y="422" font-size="23" fill="#173047" font-weight="400">CLIP vocab.json + merges.txt</text><text x="967" y="489" font-size="23" fill="#173047" font-weight="400">图片 + prompts.json</text><text x="967" y="556" font-size="23" fill="#173047" font-weight="400">模型输入、输出和配置成套使用</text><rect x="50" y="693" width="1340" height="70" rx="18" fill="#173047"/><text x="82" y="737" font-size="24" fill="#edf6fa" font-weight="400">换后端：注册对应引擎与原生库。换模型：重新核对前处理、端口、形状、tokenizer 与后处理。</text></g></svg>
