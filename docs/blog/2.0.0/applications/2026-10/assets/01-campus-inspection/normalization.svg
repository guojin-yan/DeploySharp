<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">同一张原图，两套独立前处理</title><desc id="desc">原图只解码一次，NanoDet 使用 RGB 与黑边 Letterbox，CLIP 使用 RGB 与独立短边缩放和归一化参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#369a8c"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1440" height="800" rx="20" fill="#f4f7fb" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="68" font-size="36" fill="#173047" font-weight="700">共享原图，不共享错误的前处理</text><text x="50" y="113" font-size="23" fill="#586e83" font-weight="400">几何、通道、数值范围分别跟随模型；准备好的张量只属于对应的 Encoder。</text><rect x="50" y="170" width="305" height="440" rx="20" fill="#e0ecef" stroke="#c2d7da"/><text x="76" y="214" font-size="27" fill="#173047" font-weight="700">原图只解码一次</text><text x="76" y="262" font-size="23" fill="#173047" font-weight="400">保存源图尺寸</text><text x="76" y="306" font-size="23" fill="#173047" font-weight="400">共享已解码像素</text><text x="76" y="350" font-size="23" fill="#173047" font-weight="400">整图交给 NanoDet</text><text x="76" y="394" font-size="23" fill="#173047" font-weight="400">源图 ROI 交给 CLIP</text><rect x="465" y="170" width="925" height="203" rx="20" fill="#e2f1e9" stroke="#c2d7da"/><text x="491" y="214" font-size="27" fill="#173047" font-weight="700">NanoDet-Plus · 整张图像</text><text x="491" y="262" font-size="23" fill="#173047" font-weight="400">Letterbox → 416 × 416 · RGB · NCHW</text><text x="491" y="306" font-size="23" fill="#173047" font-weight="400">(pixel − [103.53,116.28,123.675]) / [57.375,57.12,58.395]</text><text x="491" y="350" font-size="23" fill="#173047" font-weight="400">尺寸 Floor · 黑边 · Linear（官方 demo 为 Area）</text><rect x="465" y="403" width="925" height="235" rx="20" fill="#e8edf8" stroke="#c2d7da"/><text x="491" y="447" font-size="27" fill="#173047" font-weight="700">CLIP · 检测 ROI + 少量边距</text><text x="491" y="495" font-size="23" fill="#173047" font-weight="400">短边缩放 → 中心裁剪 224 × 224 · RGB · NCHW</text><text x="491" y="539" font-size="23" fill="#173047" font-weight="400">(pixel / 255 − CLIP mean) / CLIP std</text><text x="491" y="583" font-size="23" fill="#173047" font-weight="400">本例从 Profile 读取等价的 0—255 域参数。</text><text x="491" y="627" font-size="23" fill="#173047" font-weight="400">OpenCV Cubic 的像素结果不等同 Pillow。</text><path d="M371 342H410V270H443" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><path d="M410 342V520H443" fill="none" stroke="#369a8c" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="690" width="1340" height="67" rx="20" fill="#173047" stroke="none"/><text x="82" y="732" font-size="25" fill="#edf6fa" font-weight="400">能切换 Resize / Letterbox / CenterCrop，不代表任意切换后都保持原模型精度。</text></g></svg>
