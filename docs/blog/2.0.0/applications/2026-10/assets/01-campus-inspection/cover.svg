<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">DeploySharp：园区车辆与人员巡检</title><desc id="desc">NanoDet 检测、区域规则、CLIP 候选与人工复核的流程示意，不是实际部署截图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#379b8d"/></marker></defs><rect width="1440" height="810" rx="22" fill="#102238"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="55" y="38" width="190" height="35" rx="18" fill="#25445a" stroke="none"/><text x="77" y="63" font-size="20" fill="#c4dfec" font-weight="600">JYPPX · 开源项目</text><text x="1193" y="65" font-size="21" fill="#bed6e6" font-weight="600">应用实战 / 01</text><text x="58" y="180" font-size="94" fill="#f4f8fd" font-weight="750">DeploySharp</text><text x="62" y="252" font-size="52" fill="#80dfcf" font-weight="750">打造智能巡检台</text><text x="65" y="317" font-size="34" fill="#f4f8fd" font-weight="650">NanoDet + CLIP</text><text x="65" y="366" font-size="27" fill="#b8cede" font-weight="400">车辆与人员 · 多截图 · 区域规则</text><text x="65" y="411" font-size="26" fill="#b8cede" font-weight="400">从检测框，走到可复核的业务结果</text><g transform="translate(830 170)"><path d="M0 300L234 188L497 310L266 450Z" fill="#203d50" stroke="#3f6579" stroke-width="2"/><path d="M50 305L220 223L418 315L251 397Z" fill="#506579"/><path d="M210 249L359 320" stroke="#d5e1e5" stroke-width="5" stroke-dasharray="16 14"/><path d="M80 218V90L210 35L210 168Z" fill="#2d5870"/><path d="M210 35L303 81V212L210 168Z" fill="#204157"/><path d="M80 90L174 135L303 81L210 35Z" fill="#456e87"/><g fill="#8ac8d3"><rect x="104" y="116" width="24" height="30"/><rect x="145" y="137" width="24" height="30"/><rect x="229" y="112" width="25" height="31"/></g><path d="M360 245V75" stroke="#a8c6d5" stroke-width="10"/><path d="M334 75H391L408 95H351Z" fill="#d4e6ee" stroke="#6b96a7" stroke-width="3"/><circle cx="392" cy="87" r