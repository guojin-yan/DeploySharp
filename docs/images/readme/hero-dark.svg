    <text x="72" y="119" fill="#b4c6d4" font-size="18">Reproducible AI inference workflows for .NET</text>

    <rect x="70" y="150" width="370" height="42" rx="10" fill="#0d141c" stroke="#395163"/>
    <circle cx="91" cy="171" r="5" fill="#73e1b2"/>
