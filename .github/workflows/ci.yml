name: ci

on:
  # CI is intentionally manual during the alpha build-out.
  # Alpha 开发阶段故意只允许手动触发，避免每次备份推送消耗 Actions 配额。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net46
          - net481
          - netcoreapp3.1
          - netstandard2.0
          - net8.0
          - net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/DeploySharp.Core/DeploySharp.Core.csproj --locked-mode
      - run: dotnet build src/DeploySharp.Core/DeploySharp.Core.csproj -c Release -f ${{ matrix.framework }} --no-restore

  llm-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: src/DeploySharp.LLM/DeploySharp.LLM.csproj
            frameworks: netstandard2.0;netcoreapp3.1;net10.0
          - path: src/DeploySharp.Backend.LlamaSharp/DeploySharp.Backend.LlamaSharp.csproj
            frameworks: netstandard2.0;net8.0
          - path: src/DeploySharp.Backend.OnnxRuntime/DeploySharp.Backend.OnnxRuntime.csproj
            frameworks: netstandard2.0;net8.0
          - path: src/DeploySharp.Backend.OpenVINO/DeploySharp.Backend.OpenVINO.csproj
            frameworks: net46;net461;net462;net47;net471;net472;net48;net481;netcoreapp3.1;net5.0;net6.0;net7.0;net8.0;net9.0;net10.0
          - path: src/DeploySharp.ModelPack.Json/DeploySharp.ModelPack.Json.csproj
            frameworks: netstandard2.0;net8.0;net9.0;net10.0
          - path: src/DeploySharp.ModelFactory/DeploySharp.ModelFactory.csproj
            frameworks: netstandard2.0;net8.0;net9.0;net10.0
          - path: src/DeploySharp.Visual/DeploySharp.Visual.csproj
            frameworks: net46;net461;net462;net47;net471;net472;net48;net481;netstandard2.0;netcoreapp3.1;net5.0;net6.0;net7.0;net8.0;net9.0;net10.0
          - path: src/DeploySharp.Visual.OpenCV/DeploySharp.Visual.OpenCV.csproj
            frameworks: net46;net461;net462;net47;net471;net472;net48;net481;netcoreapp3.1;net5.0;net6.0;net7.0;net8.0;net9.0;net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ${{ matrix.project.path }} --locked-mode
      - shell: pwsh
        run: |
          $frameworks = '${{ matrix.project.frameworks }}'.Split(';')
          foreach ($framework in $frameworks) {
            dotnet build '${{ matrix.project.path }}' -c Release -f $framework --no-restore
          }

  test-and-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DeploySharp.sln --locked-mode
      - run: dotnet test tests/DeploySharp.Core.Tests/DeploySharp.Core.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.LLM.Tests/DeploySharp.LLM.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.Backend.LlamaSharp.Tests/DeploySharp.Backend.LlamaSharp.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.ModelPack.Json.Tests/DeploySharp.ModelPack.Json.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.ModelFactory.Tests/DeploySharp.ModelFactory.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.Visual.Tests/DeploySharp.Visual.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.Backend.OnnxRuntime.Tests/DeploySharp.Backend.OnnxRuntime.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.Backend.OpenVINO.Tests/DeploySharp.Backend.OpenVINO.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/DeploySharp.Visual.OpenCV.Tests/DeploySharp.Visual.OpenCV.Tests.csproj -c Release --no-restore
      - shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/model-catalog/Update-ModelCatalogTable.ps1 -Check
      - shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/docs/Test-BilingualApiDocs.ps1 -DocumentationFile src/DeploySharp.Core/bin/Release/net10.0/JYPPX.DeploySharp.Core.xml,src/DeploySharp.LLM/bin/Release/net10.0/JYPPX.DeploySharp.LLM.xml,src/DeploySharp.Backend.LlamaSharp/bin/Release/net8.0/JYPPX.DeploySharp.Backend.LlamaSharp.xml,src/DeploySharp.Backend.OnnxRuntime/bin/Release/net8.0/JYPPX.DeploySharp.Backend.OnnxRuntime.xml,src/DeploySharp.Backend.OpenVINO/bin/Release/net10.0/JYPPX.DeploySharp.Backend.OpenVINO.xml,src/DeploySharp.ModelPack.Json/bin/Release/net10.0/JYPPX.DeploySharp.ModelPack.Json.xml,src/DeploySharp.ModelFactory/bin/Release/net10.0/JYPPX.DeploySharp.ModelFactory.xml,src/DeploySharp.Visual/bin/Release/net10.0/JYPPX.DeploySharp.Visual.xml,src/DeploySharp.Visual.OpenCV/bin/Release/net10.0/JYPPX.DeploySharp.Visual.OpenCV.xml
      - run: dotnet tool restore
      - run: dotnet tool run docfx docs/docfx.json --warningsAsErrors
      - run: dotnet pack src/DeploySharp.Core/DeploySharp.Core.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.LLM/DeploySharp.LLM.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.Backend.LlamaSharp/DeploySharp.Backend.LlamaSharp.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.Backend.OnnxRuntime/DeploySharp.Backend.OnnxRuntime.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.Backend.OpenVINO/DeploySharp.Backend.OpenVINO.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.ModelPack.Json/DeploySharp.ModelPack.Json.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.ModelFactory/DeploySharp.ModelFactory.csproj -c Release --no-restore
      - run: dotnet pack src/DeploySharp.Visual/DeploySharp.Visual.csproj -c Release --no-restore
      - shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/pack/Test-VisualNuGetPackage.ps1 -PackagePath ./artifacts/packages/JYPPX.DeploySharp.Visual.2.0.0-alpha.1.nupkg
      - run: dotnet pack src/DeploySharp.Visual.OpenCV/DeploySharp.Visual.OpenCV.csproj -c Release --no-restore
      - run: dotnet restore tests/clean-consumer/llamasharp/DeploySharp.LlamaSharp.CleanConsumer.csproj --configfile tests/clean-consumer/llamasharp/NuGet.Config
      - run: dotnet build tests/clean-consumer/llamasharp/DeploySharp.LlamaSharp.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/llamasharp/DeploySharp.LlamaSharp.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/modelpack-json/DeploySharp.ModelPack.Json.CleanConsumer.csproj --configfile tests/clean-consumer/modelpack-json/NuGet.Config
      - run: dotnet build tests/clean-consumer/modelpack-json/DeploySharp.ModelPack.Json.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/modelpack-json/DeploySharp.ModelPack.Json.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/modelfactory/DeploySharp.ModelFactory.CleanConsumer.csproj --configfile tests/clean-consumer/modelfactory/NuGet.Config
      - run: dotnet build tests/clean-consumer/modelfactory/DeploySharp.ModelFactory.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/modelfactory/DeploySharp.ModelFactory.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual/DeploySharp.Visual.CleanConsumer.csproj --configfile tests/clean-consumer/visual/NuGet.Config
      - run: dotnet build tests/clean-consumer/visual/DeploySharp.Visual.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual/DeploySharp.Visual.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/onnxruntime/DeploySharp.OnnxRuntime.CleanConsumer.csproj --configfile tests/clean-consumer/onnxruntime/NuGet.Config
      - run: dotnet build tests/clean-consumer/onnxruntime/DeploySharp.OnnxRuntime.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/onnxruntime/DeploySharp.OnnxRuntime.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-segmentation/DeploySharp.Visual.Segmentation.CleanConsumer.csproj --configfile tests/clean-consumer/visual-segmentation/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-segmentation/DeploySharp.Visual.Segmentation.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-segmentation/DeploySharp.Visual.Segmentation.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-pose/DeploySharp.Visual.Pose.CleanConsumer.csproj --configfile tests/clean-consumer/visual-pose/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-pose/DeploySharp.Visual.Pose.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-pose/DeploySharp.Visual.Pose.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-instance-segmentation/DeploySharp.Visual.InstanceSegmentation.CleanConsumer.csproj --configfile tests/clean-consumer/visual-instance-segmentation/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-instance-segmentation/DeploySharp.Visual.InstanceSegmentation.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-instance-segmentation/DeploySharp.Visual.InstanceSegmentation.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-obb/VisualObbConsumer.csproj --configfile tests/clean-consumer/visual-obb/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-obb/VisualObbConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-obb/VisualObbConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-ocr/VisualOcrConsumer.csproj --configfile tests/clean-consumer/visual-ocr/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-ocr/VisualOcrConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-ocr/VisualOcrConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-anomaly/VisualAnomalyConsumer.csproj --configfile tests/clean-consumer/visual-anomaly/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-anomaly/VisualAnomalyConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-anomaly/VisualAnomalyConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/onnxruntime-missing-native/DeploySharp.OnnxRuntime.MissingNativeConsumer.csproj --configfile tests/clean-consumer/onnxruntime-missing-native/NuGet.Config
      - run: dotnet build tests/clean-consumer/onnxruntime-missing-native/DeploySharp.OnnxRuntime.MissingNativeConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/onnxruntime-missing-native/DeploySharp.OnnxRuntime.MissingNativeConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/openvino/DeploySharp.OpenVino.CleanConsumer.csproj --configfile tests/clean-consumer/openvino/NuGet.Config
      - run: dotnet build tests/clean-consumer/openvino/DeploySharp.OpenVino.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/openvino/DeploySharp.OpenVino.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/openvino-missing-native/DeploySharp.OpenVino.MissingNativeConsumer.csproj --configfile tests/clean-consumer/openvino-missing-native/NuGet.Config
      - run: dotnet build tests/clean-consumer/openvino-missing-native/DeploySharp.OpenVino.MissingNativeConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/openvino-missing-native/DeploySharp.OpenVino.MissingNativeConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-opencv/DeploySharp.Visual.OpenCv.CleanConsumer.csproj --configfile tests/clean-consumer/visual-opencv/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-opencv/DeploySharp.Visual.OpenCv.CleanConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-opencv/DeploySharp.Visual.OpenCv.CleanConsumer.csproj -c Release --no-build
      - run: dotnet restore tests/clean-consumer/visual-opencv-missing-native/DeploySharp.Visual.OpenCv.MissingNativeConsumer.csproj --configfile tests/clean-consumer/visual-opencv-missing-native/NuGet.Config --locked-mode
      - run: dotnet build tests/clean-consumer/visual-opencv-missing-native/DeploySharp.Visual.OpenCv.MissingNativeConsumer.csproj -c Release --no-restore
      - run: dotnet run --project tests/clean-consumer/visual-opencv-missing-native/DeploySharp.Visual.OpenCv.MissingNativeConsumer.csproj -c Release --no-build
