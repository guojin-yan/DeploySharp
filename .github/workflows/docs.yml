# Build and deploy DocFX documentation / 构建并部署 DocFX 文档
name: docs

on:
  # Documentation deployment is manual until the local DocFX gate is stable.
  # 文档部署在本地 DocFX 门禁稳定前只允许手动触发。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository / 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET / 配置 .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tools / 还原工具
        run: dotnet tool restore
      - name: Restore projects / 还原项目
        run: dotnet restore DeploySharp.sln --locked-mode
      - name: Build API XML / 构建 API XML 文档
        run: dotnet build src/DeploySharp.Core/DeploySharp.Core.csproj -c Release -f net8.0 --no-restore
      - name: Build LLM API XML / 构建 LLM API XML 文档
        run: dotnet build src/DeploySharp.LLM/DeploySharp.LLM.csproj -c Release -f net8.0 --no-restore
      - name: Build LLamaSharp API XML / 构建 LLamaSharp API XML 文档
        run: dotnet build src/DeploySharp.Backend.LlamaSharp/DeploySharp.Backend.LlamaSharp.csproj -c Release -f net8.0 --no-restore
      - name: Build ONNX Runtime API XML / 构建 ONNX Runtime API XML 文档
        run: dotnet build src/DeploySharp.Backend.OnnxRuntime/DeploySharp.Backend.OnnxRuntime.csproj -c Release -f net8.0 --no-restore
      - name: Build ModelPack JSON API XML / 构建 ModelPack JSON API XML 文档
        run: dotnet build src/DeploySharp.ModelPack.Json/DeploySharp.ModelPack.Json.csproj -c Release -f net10.0 --no-restore
      - name: Build ModelFactory API XML / 构建 ModelFactory API XML 文档
        run: dotnet build src/DeploySharp.ModelFactory/DeploySharp.ModelFactory.csproj -c Release -f net10.0 --no-restore
      - name: Build Visual API XML / 构建 Visual API XML 文档
        run: dotnet build src/DeploySharp.Visual/DeploySharp.Visual.csproj -c Release -f net8.0 --no-restore
      - name: Validate generated model catalog / 校验生成的模型目录
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/model-catalog/Update-ModelCatalogTable.ps1 -Check
      - name: Validate bilingual API docs / 校验双语 API 注释
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/docs/Test-BilingualApiDocs.ps1 -DocumentationFile src/DeploySharp.Core/bin/Release/net8.0/JYPPX.DeploySharp.Core.xml,src/DeploySharp.LLM/bin/Release/net8.0/JYPPX.DeploySharp.LLM.xml,src/DeploySharp.Backend.LlamaSharp/bin/Release/net8.0/JYPPX.DeploySharp.Backend.LlamaSharp.xml,src/DeploySharp.Backend.OnnxRuntime/bin/Release/net8.0/JYPPX.DeploySharp.Backend.OnnxRuntime.xml,src/DeploySharp.ModelPack.Json/bin/Release/net10.0/JYPPX.DeploySharp.ModelPack.Json.xml,src/DeploySharp.ModelFactory/bin/Release/net10.0/JYPPX.DeploySharp.ModelFactory.xml,src/DeploySharp.Visual/bin/Release/net8.0/JYPPX.DeploySharp.Visual.xml
      - name: Build DocFX site / 构建 DocFX 站点
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors
      - name: Disable Jekyll / 禁用 Jekyll
        shell: bash
        run: touch docs/_site/.nojekyll
      - name: Upload documentation artifact / 上传文档产物
        uses: actions/upload-artifact@v4
        with:
          name: deploysharp-documentation
          path: docs/_site
          retention-days: 7
      - name: Upload Pages artifact / 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages / 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
